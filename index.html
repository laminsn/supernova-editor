function StatusPipeline({status}) {
  const stages = ['sent','viewed','scheduled','posted','confirmed'];
  const idx = stages.indexOf(status);
  return (
    <div className="pipeline-dots">
      {stages.map((s,i) => (
        <React.Fragment key={s}>
          {i > 0 && <div className={`pipeline-line ${i <= idx ? 'filled' : ''}`}></div>}
          <div className={`pipeline-dot ${i < idx ? 'filled' : ''} ${i === idx ? 'current' : ''}`} title={s}>
            {i <= idx && <span style={{fontSize:6,color:i===idx?'var(--ink)':'#fff'}}>&#10003;</span>}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function CollaborationView() {
  const {addToast} = useApp();
  const [collabTab, setCollabTab] = useState('directory');
  const [selectedCampaign, setSelectedCampaign] = useState(null);
  const [editingCampaign, setEditingCampaign] = useState(null);
  const [editingCollab, setEditingCollab] = useState(null);
  const [filterPlatform, setFilterPlatform] = useState('all');
  const [filterTier, setFilterTier] = useState('all');
  const [previewMode, setPreviewMode] = useState('desktop');
  const [collaborators, setCollaborators] = useState(MOCK_COLLABORATORS);
  const [campaigns, setCampaigns] = useState(MOCK_CAMPAIGNS);
  const [packages, setPackages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [sendingPackages, setSendingPackages] = useState(false);
  const [sendProgress, setSendProgress] = useState(0);
  const [liveMode, setLiveMode] = useState(false);

  const tierColor = (t) => t==='Platinum'?'#E5E4E2':t==='Gold'?'#FFD700':t==='Silver'?'#C0C0C0':'#CD7F32';

  // Load from Supabase if connected
  useEffect(() => {
    const sb = window.SupabaseClient;
    if (!sb || !sb.isReady()) return;
    setLiveMode(true);
    setLoading(true);
    (async () => {
      const wsId = sb.getWorkspaceId();
      const collabs = await sb.fetch('collaborators', wsId ? {eq:{workspace_id:wsId}, order:'created_at', ascending:false} : {order:'created_at', ascending:false});
      const camps = await sb.fetch('campaigns', wsId ? {eq:{workspace_id:wsId}, order:'created_at', ascending:false} : {order:'created_at', ascending:false});
      const pkgs = await sb.fetch('packages', wsId ? {eq:{workspace_id:wsId}, order:'sent_at', ascending:false} : {order:'sent_at', ascending:false});
      // Map DB rows to our component shape
      if (collabs && collabs.length) setCollaborators(collabs.map(c => ({
        id: c.id, name: c.name, handle: c.handle, platform: c.platform || 'ig',
        timezone: c.timezone || 'EST', tier: c.tier || 'Bronze', level: c.level || 'Influencer',
        photo: (c.name||'?').charAt(0).toUpperCase(), email: c.email,
        followers: c.followers || '0', engagement: c.engagement || 0, posts: c.posts_completed || 0,
        lastActive: c.last_active ? new Date(c.last_active).toLocaleDateString() : 'Never',
        status: c.status || 'active', tags: c.tags || []
      })));
      if (camps && camps.length) setCampaigns(camps.map(c => ({
        id: c.id, name: c.name, status: c.status || 'draft',
        collaborators: c.collaborator_ids || [], total: (c.collaborator_ids||[]).length,
        sent: 0, posted: 0,
        start: c.start_date ? new Date(c.start_date).toLocaleDateString('en',{month:'short',day:'numeric'}) : '',
        end: c.end_date ? new Date(c.end_date).toLocaleDateString('en',{month:'short',day:'numeric'}) : '',
        content_ids: c.content_ids || []
      })));
      if (pkgs) setPackages(pkgs);
      setLoading(false);
    })();
  }, []);

  const filtered = collaborators.filter(c => {
    if (filterPlatform !== 'all' && c.platform !== filterPlatform) return false;
    if (filterTier !== 'all' && c.tier.toLowerCase() !== filterTier) return false;
    return true;
  });

  // CAMPAIGN CRUD
  const saveCampaign = async (camp) => {
    const sb = window.SupabaseClient;
    const isNew = !camp.id || typeof camp.id === 'number';
    if (sb && sb.isReady()) {
      const wsId = sb.getWorkspaceId();
      const payload = {
        workspace_id: wsId,
        name: camp.name,
        status: camp.status || 'draft',
        start_date: camp.start_date || null,
        end_date: camp.end_date || null,
        collaborator_ids: camp.collaborator_ids || [],
        content_ids: camp.content_ids || [],
      };
      if (isNew) {
        const res = await sb.insert('campaigns', payload);
        if (res && res[0]) {
          const newCamp = {id: res[0].id, name: res[0].name, status: res[0].status, collaborators: res[0].collaborator_ids||[], total: (res[0].collaborator_ids||[]).length, sent: 0, posted: 0, start: '', end: '', content_ids: res[0].content_ids||[]};
          setCampaigns(prev => [newCamp, ...prev]);
          setSelectedCampaign(newCamp);
          addToast('Campaign saved to database!','success');
        } else {
          addToast('Save failed — check console','error');
        }
      } else {
        const res = await sb.update('campaigns', camp.id, payload);
        if (res) {
          setCampaigns(prev => prev.map(c => c.id === camp.id ? {...c, ...camp, collaborators: camp.collaborator_ids||[], total: (camp.collaborator_ids||[]).length} : c));
          addToast('Campaign updated!','success');
        }
      }
    } else {
      // Local-only mode
      if (isNew) {
        const newCamp = {...camp, id: Date.now(), collaborators: camp.collaborator_ids||[], total: (camp.collaborator_ids||[]).length, sent: 0, posted: 0};
        setCampaigns(prev => [newCamp, ...prev]);
        setSelectedCampaign(newCamp);
      } else {
        setCampaigns(prev => prev.map(c => c.id === camp.id ? {...c, ...camp, collaborators: camp.collaborator_ids||[]} : c));
      }
      addToast('Campaign saved locally (connect Supabase to persist)','info');
    }
    setEditingCampaign(null);
  };

  const deleteCampaign = async (id) => {
    if (!confirm('Delete this campaign?')) return;
    const sb = window.SupabaseClient;
    if (sb && sb.isReady()) await sb.delete('campaigns', id);
    setCampaigns(prev => prev.filter(c => c.id !== id));
    if (selectedCampaign?.id === id) setSelectedCampaign(null);
    addToast('Campaign deleted','info');
  };

  // BUILD & SEND PACKAGES
  const buildAndSendPackages = async (camp) => {
    if (!camp.collaborators || camp.collaborators.length === 0) {
      addToast('Add at least one collaborator first','error');
      return;
    }
    setSendingPackages(true);
    setSendProgress(0);
    const sb = window.SupabaseClient;
    const wsId = sb && sb.isReady() ? sb.getWorkspaceId() : null;
    const total = camp.collaborators.length;
    const newPackages = [];
    let sentCount = 0;

    for (let i = 0; i < camp.collaborators.length; i++) {
      const cid = camp.collaborators[i];
      const col = collaborators.find(c => c.id === cid);
      if (!col) continue;

      // Generate package content
      const platformHashtagCount = {ig: 30, tt: 5, yt: 15, li: 5, fb: 10}[col.platform] || 10;
      const baseHashtags = ['aiautomation','aibusiness','contentcreator','aitools','smallbusiness','entrepreneurlife','aistrategy','contentmachine','automation','socialstrategy','contentcreation','aiagents','businessautomation','growthhacking','digitalmarketing','reelsinstagram','contentmarketing','techstartup','onlinebusiness','ailife','businesstips','marketingtips','viralcontent','socialmediatips','growthmindset','contentisking','aisolutions','buildwithAI','futureofwork','nocode'];
      const hashtags = baseHashtags.slice(0, platformHashtagCount).map(h => '#' + h);

      const optimalTime = {ig:'11:00 AM', tt:'7:00 PM', yt:'2:00 PM', li:'9:00 AM', fb:'1:00 PM'}[col.platform] || '12:00 PM';
      const scheduledFor = new Date();
      scheduledFor.setDate(scheduledFor.getDate() + i + 1);

      const pkg = {
        workspace_id: wsId,
        campaign_id: typeof camp.id === 'string' ? camp.id : null,
        collaborator_id: typeof cid === 'string' ? cid : null,
        status: 'sent',
        caption: `Most people think AI automation is about saving time.\n\nIt's actually about making decisions you didn't know you were missing.\n\nHere's what changed when I deployed my first AI agent...\n\nComment "DECISIONS" and I'll send you the full framework.\n\n${hashtags.slice(0,3).join(' ')}`,
        hashtags: hashtags,
        mentions: ['@LaminSNgobeh'],
        scheduled_for: scheduledFor.toISOString(),
        utm_link: `https://supernova.app/r/${camp.id}/${cid}?utm_source=${col.platform}&utm_medium=collab&utm_campaign=${encodeURIComponent(camp.name)}`,
        sent_at: new Date().toISOString(),
      };

      // Save to Supabase
      if (sb && sb.isReady() && wsId) {
        const saved = await sb.insert('packages', pkg);
        if (saved && saved[0]) {
          newPackages.push(saved[0]);
          sentCount++;
        }
      } else {
        newPackages.push({...pkg, id: 'local-'+Date.now()+'-'+i});
        sentCount++;
      }

      // Trigger email send via Vercel function
      try {
        const emailRes = await fetch('/api/send-package', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            to: col.email,
            collaboratorName: col.name,
            campaignName: camp.name,
            postingTime: `${scheduledFor.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})} at ${optimalTime} ${col.timezone}`,
            platform: col.platform,
            caption: pkg.caption,
            hashtags: pkg.hashtags.join(' '),
            mentions: pkg.mentions.join(' '),
            trackingUrl: pkg.utm_link,
          })
        });
        if (emailRes.ok) addToast(`✓ Email sent to ${col.name}`,'success');
        else if (emailRes.status === 404) addToast(`Package built for ${col.name} (email API not deployed)`,'info');
        else { const err = await emailRes.text(); console.warn('email error:', err); }
      } catch(e) {
        console.warn('email fetch failed:', e);
      }

      setSendProgress(Math.round(((i+1)/total)*100));
    }

    setPackages(prev => [...newPackages, ...prev]);
    // Update campaign sent count
    setCampaigns(prev => prev.map(c => c.id === camp.id ? {...c, sent: sentCount, status: 'active'} : c));
    if (sb && sb.isReady() && typeof camp.id === 'string') {
      await sb.update('campaigns', camp.id, {status: 'active'});
    }

    setTimeout(() => { setSendingPackages(false); setSendProgress(0); }, 1500);
    addToast(`${sentCount}/${total} packages sent successfully!`,'success');
  };

  return (
    <div className="view-enter">
      <div className="view-head">
        <div>
          <h1>Collaboration {liveMode && <span style={{fontFamily:'var(--mono)',fontSize:'.62rem',padding:'.2rem .5rem',background:'rgba(0,230,138,0.15)',color:'var(--green)',borderRadius:999,marginLeft:'.5rem',verticalAlign:'middle',letterSpacing:'.1em'}}>● LIVE</span>}</h1>
          <div className="sub">Send turnkey content packages. Collaborators just copy, paste, and post.</div>
        </div>
        <div style={{display:'flex',gap:'.5rem'}}>
          <button className="btn btn-ghost btn-sm" onClick={() => setEditingCollab({})}>{Icons.userPlus} Add Collaborator</button>
          <button className="btn btn-primary btn-sm" onClick={() => setEditingCampaign({collaborator_ids:[],content_ids:[],status:'draft'})}>{Icons.send} New Campaign</button>
        </div>
      </div>

      <div className="tabs">
        {[{k:'directory',l:'Directory'},{k:'campaigns',l:'Campaigns'},{k:'tracker',l:'Package Tracker'},{k:'builder',l:'Email Builder'}].map(t => (
          <button key={t.k} className={`tab ${collabTab===t.k?'active':''}`} onClick={() => setCollabTab(t.k)}>{t.l}</button>
        ))}
      </div>

      {/* COLLABORATOR EDIT MODAL */}
      {editingCollab && <CollaboratorModal collab={editingCollab} onSave={async (data) => {
        const sb = window.SupabaseClient;
        const wsId = sb && sb.isReady() ? sb.getWorkspaceId() : null;
        const isNew = !data.id;
        const payload = {
          workspace_id: wsId,
          name: data.name, handle: data.handle, email: data.email,
          platform: data.platform, timezone: data.timezone,
          tier: data.tier, level: data.level,
          followers: data.followers, engagement: parseFloat(data.engagement)||0,
          status: data.status||'active', tags: data.tags||[]
        };
        if (sb && sb.isReady()) {
          if (isNew) {
            const res = await sb.insert('collaborators', payload);
            if (res && res[0]) {
              setCollaborators(prev => [{
                id:res[0].id,name:res[0].name,handle:res[0].handle,platform:res[0].platform,
                timezone:res[0].timezone,tier:res[0].tier,level:res[0].level,
                photo:(res[0].name||'?').charAt(0).toUpperCase(),email:res[0].email,
                followers:res[0].followers,engagement:res[0].engagement,posts:0,lastActive:'Just added',status:res[0].status,tags:res[0].tags||[]
              }, ...prev]);
              addToast('Collaborator saved!','success');
            }
          } else {
            await sb.update('collaborators', data.id, payload);
            setCollaborators(prev => prev.map(c => c.id===data.id?{...c,...data}:c));
            addToast('Collaborator updated!','success');
          }
        } else {
          if (isNew) setCollaborators(prev => [{...data, id:Date.now(), photo:(data.name||'?').charAt(0).toUpperCase(), posts:0, lastActive:'Just added'}, ...prev]);
          else setCollaborators(prev => prev.map(c => c.id===data.id?{...c,...data}:c));
        }
        setEditingCollab(null);
      }} onClose={() => setEditingCollab(null)} />}

      {/* CAMPAIGN EDIT MODAL */}
      {editingCampaign && <CampaignModal camp={editingCampaign} collaborators={collaborators} onSave={saveCampaign} onClose={() => setEditingCampaign(null)} />}

      {/* DIRECTORY */}
      {collabTab === 'directory' && (
        <>
          <div className="stats-grid" style={{marginBottom:'1.25rem'}}>
            <div className="stat-card"><div className="label">Total Collaborators</div><div className="value">{collaborators.length}</div><div className="delta">{collaborators.filter(c=>c.status==='active').length} active</div></div>
            <div className="stat-card"><div className="label">Avg Engagement</div><div className="value">{collaborators.length?(collaborators.reduce((s,c)=>s+(c.engagement||0),0)/collaborators.length).toFixed(1):'0'}%</div><div className="delta">Above industry avg</div></div>
            <div className="stat-card"><div className="label">Packages Sent</div><div className="value">{packages.length || collaborators.reduce((s,c)=>s+(c.posts||0),0)}</div><div className="delta">{liveMode?'Live from DB':'Across all campaigns'}</div></div>
            <div className="stat-card"><div className="label">Total Reach</div><div className="value">{(()=>{const total=collaborators.reduce((s,c)=>{const f=parseFloat((c.followers||'0').replace(/[KM]/g,''));const m=(c.followers||'').includes('M')?1000000:(c.followers||'').includes('K')?1000:1;return s+(f*m);},0);return total>1000000?(total/1000000).toFixed(1)+'M':total>1000?(total/1000).toFixed(0)+'K':total;})()}</div><div className="delta">Combined followers</div></div>
          </div>

          <div style={{display:'flex',gap:'.5rem',marginBottom:'1.25rem',flexWrap:'wrap'}}>
            <select className="input" value={filterPlatform} onChange={e => setFilterPlatform(e.target.value)} style={{width:'auto',minWidth:140}}>
              <option value="all">All Platforms</option>
              <option value="ig">Instagram</option><option value="tt">TikTok</option><option value="yt">YouTube</option><option value="li">LinkedIn</option><option value="fb">Facebook</option>
            </select>
            <select className="input" value={filterTier} onChange={e => setFilterTier(e.target.value)} style={{width:'auto',minWidth:120}}>
              <option value="all">All Tiers</option>
              <option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option>
            </select>
          </div>

          {loading ? <div style={{padding:'3rem',textAlign:'center',color:'var(--text-dim)'}}>Loading from database...</div> : (
            <div className="collab-grid">

                    <div><div style={{fontFamily:'var(--display)',fontWeight:800,fontSize:'1rem',color:'var(--green)'}}>{c.engagement}%</div><div style={{fontFamily:'var(--mono)',fontSize:'.58rem',color:'var(--text-dim)',textTransform:'uppercase'}}>Eng Rate</div></div>

                  <div style={{display:'flex',gap:'.5rem'}}>
                    <button className="btn btn-primary btn-sm" style={{flex:1}} onClick={() => setEditingCampaign({collaborator_ids:[c.id],content_ids:[],status:'draft',name:`Send to ${c.name}`})}>{Icons.send} Send Package</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => setEditingCollab(c)}>Edit</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {/* CAMPAIGNS */}
      {collabTab === 'campaigns' && (
        <div className="grid-2">
          <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
            {campaigns.map(camp => (
              <div key={camp.id} className="card" style={{cursor:'pointer',borderColor:selectedCampaign?.id===camp.id?'var(--yellow)':'var(--glass-border)'}} onClick={() => setSelectedCampaign(camp)}>

                  <span style={{fontFamily:'var(--mono)',fontSize:'.68rem',padding:'.2rem .5rem',borderRadius:'var(--radius)',background:camp.status==='active'?'rgba(0,230,138,0.1)':camp.status==='completed'?'rgba(139,92,246,0.1)':'rgba(255,214,10,0.1)',color:camp.status==='active'?'var(--green)':camp.status==='completed'?'var(--purple)':'var(--yellow)',textTransform:'uppercase'}}>{camp.status}</span>

                </div>

          <div className="card">

                      <div key={cid} style={{display:'flex',alignItems:'center',gap:'.75rem',padding:'.65rem 0',borderBottom:'1px solid var(--border)'}}>

                        </div>
                        <div style={{fontFamily:'var(--mono)',fontSize:'.72rem',color:'var(--text-dim)'}}>

                        </div>
                      </div>

                  })}

                    <div style={{fontFamily:'var(--mono)',fontSize:'.78rem',color:'var(--yellow)',marginBottom:'.5rem'}}>Building & sending packages... {sendProgress}%</div>

                      <div style={{height:'100%',background:'var(--gradient-warm)',borderRadius:3,width:sendProgress+'%',transition:'width .3s'}}></div>
                    </div>

                ) : (
                  <button className="btn btn-primary" style={{width:'100%'}} onClick={() => buildAndSendPackages(selectedCampaign)} disabled={!selectedCampaign.collaborators || selectedCampaign.collaborators.length === 0}>

            ) : (
              <div style={{textAlign:'center',padding:'3rem 0',color:'var(--text-dim)'}}>Click a campaign to view details and send packages</div>
            )}
          </div>
        </div>
      )}

      {/* PACKAGE TRACKER */}
      {collabTab === 'tracker' && (
        <div className="card">
          <div className="card-head"><h3>Package Status {liveMode && <span style={{fontFamily:'var(--mono)',fontSize:'.62rem',color:'var(--green)',marginLeft:'.5rem'}}>● LIVE</span>}</h3>
            <div style={{display:'flex',gap:'.5rem'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => addToast('Reminders sent to all pending!','success')}>Remind All</button>
              <button className="btn btn-ghost btn-sm" onClick={() => addToast('Failed packages resent!','success')}>Resend Failed</button>
            </div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.88rem'}}>
              <thead>
                <tr style={{borderBottom:'1px solid var(--border)'}}>
                  {['Collaborator','Campaign','Platform','Status','Sent','Actions'].map(h => (
                    <th key={h} style={{padding:'.65rem .75rem',textAlign:'left',fontFamily:'var(--mono)',fontSize:'.7rem',color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:'.1em',fontWeight:600}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(packages.length > 0 ? packages : collaborators.slice(0,6).map((c,i) => ({collaborator_id:c.id,status:['confirmed','posted','viewed','sent','sent','confirmed'][i],campaign_id:campaigns[i%3]?.id,sent_at:`Mar ${10+i}`}))).map((pkg,i) => {
                  const c = collaborators.find(x => x.id === pkg.collaborator_id) || collaborators[i] || {};
                  const camp = campaigns.find(x => x.id === pkg.campaign_id) || campaigns[i%3] || {name:'—'};
                  return (
                    <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                      <td style={{padding:'.65rem .75rem'}}><div style={{display:'flex',alignItems:'center',gap:'.5rem'}}><div style={{width:28,height:28,borderRadius:'50%',background:'var(--gradient-warm)',display:'grid',placeItems:'center',fontFamily:'var(--display)',fontWeight:900,fontSize:'.65rem',color:'var(--ink)'}}>{c.photo||'?'}</div><div><div style={{fontWeight:600,fontSize:'.82rem'}}>{c.name||'Unknown'}</div><div style={{fontFamily:'var(--mono)',fontSize:'.65rem',color:'var(--text-dim)'}}>{c.handle||''}</div></div></div></td>
                      <td style={{padding:'.65rem .75rem',fontFamily:'var(--mono)',fontSize:'.78rem',color:'var(--text-muted)'}}>{camp.name}</td>
                      <td style={{padding:'.65rem .75rem'}}><span className={`platform-badge ${c.platform||'ig'}`} style={{fontSize:'.6rem',padding:'.1rem .35rem'}}>{(c.platform||'ig').toUpperCase()}</span></td>
                      <td style={{padding:'.65rem .75rem'}}><StatusPipeline status={pkg.status} /></td>
                      <td style={{padding:'.65rem .75rem',fontFamily:'var(--mono)',fontSize:'.75rem',color:'var(--text-dim)'}}>{typeof pkg.sent_at === 'string' && pkg.sent_at.includes('-') ? new Date(pkg.sent_at).toLocaleDateString('en',{month:'short',day:'numeric'}) : pkg.sent_at}</td>
                      <td style={{padding:'.65rem .75rem'}}><button className="btn btn-ghost btn-sm" onClick={() => addToast(`Reminder sent to ${c.name}`,'success')}>Remind</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* EMAIL BUILDER */}
      {collabTab === 'builder' && (
        <div style={{display:'grid',gridTemplateColumns:'2fr 3fr',gap:'1.25rem'}}>
          <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
            <div className="card">
              <div className="card-head"><h3>Package Template</h3></div>
              <label className="field"><span className="lbl">Subject Line</span><input className="input" defaultValue="[Action Required] Your Content Package is Ready — Post by March 18" /></label>
              <label className="field"><span className="lbl">Collaborator</span>
                <select className="input">{collaborators.map(c => <option key={c.id}>{c.name} ({c.handle})</option>)}</select>
              </label>
              <label className="field"><span className="lbl">Content Piece</span>
                <select className="input">{MOCK_CONTENT.filter(c=>c.status==='approved'||c.status==='published').map(c => <option key={c.id}>{c.title}</option>)}</select>
              </label>
            </div>
            <div className="card">
              <div className="card-head"><h3>Package Sections</h3></div>
              {['Posting Instructions','Caption & Hashtags','Brand Voice Guide','Media Attachments','Content Calendar','Cross-Promo Script','DM Response Templates','UTM Tracking Link'].map((s,i) => (
                <label key={i} style={{display:'flex',alignItems:'center',gap:'.75rem',padding:'.5rem 0',borderBottom:i<7?'1px solid var(--border)':'none',cursor:'pointer'}}>
                  <input type="checkbox" defaultChecked style={{accentColor:'var(--yellow)',width:16,height:16}} />
                  <span style={{fontSize:'.85rem',fontWeight:500}}>{s}</span>
                </label>
              ))}
            </div>
            <button className="btn btn-primary" style={{width:'100%'}} onClick={() => addToast('Use Campaigns tab to send to multiple collaborators at once','info')}>{Icons.send} Send Test Package</button>
          </div>

          <div className="card" style={{padding:0,overflow:'hidden'}}>
            <div style={{padding:'1rem 1.25rem',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <h3 style={{fontFamily:'var(--display)',fontSize:'1.1rem'}}>Package Preview</h3>
              <div style={{display:'flex',gap:'.35rem'}}>
                <button className={`btn btn-sm ${previewMode==='desktop'?'btn-primary':'btn-ghost'}`} onClick={() => setPreviewMode('desktop')}>Desktop</button>
                <button className={`btn btn-sm ${previewMode==='mobile'?'btn-primary':'btn-ghost'}`} onClick={() => setPreviewMode('mobile')}>Mobile</button>
              </div>
            </div>
            <div style={{padding:'1.25rem',background:'var(--bg)',maxHeight:600,overflowY:'auto'}}>
              <div style={{maxWidth:previewMode==='mobile'?360:'100%',margin:'0 auto'}}>
                <div className="email-preview">
                  <div className="email-header">
                    <div style={{fontSize:'.72rem',color:'#888',marginBottom:'.15rem'}}>From: Supernova Editor &lt;lamin@raraavismarketing.com&gt;</div>
                    <div style={{fontSize:'.85rem',fontWeight:700,color:'#111'}}>[Action Required] Your Content Package is Ready</div>
                  </div>
                  <div className="email-body" style={{fontSize:'.88rem',lineHeight:1.7}}>
                    <p style={{marginBottom:'1rem'}}>Hi <strong>{collaborators[0]?.name?.split(' ')[0] || 'Maya'}</strong>,</p>
                    <p style={{marginBottom:'1rem'}}>Your content package is ready. Everything you need is below — just copy, paste, and post.</p>
                    <div style={{background:'#FFF8E1',border:'1px solid #FFD60A',borderRadius:8,padding:'1rem',marginBottom:'1rem'}}>
                      <div style={{fontWeight:800,fontSize:'.82rem',color:'#333',marginBottom:'.25rem'}}>POSTING TIME</div>
                      <div style={{fontSize:'1.1rem',fontWeight:700,color:'#111'}}>Monday, March 18 at 11:00 AM PST</div>
                      <div style={{fontSize:'.78rem',color:'#666'}}>Instagram Reel &middot; Optimized for your timezone</div>
                    </div>
                    <div style={{textAlign:'center',padding:'1.5rem 0'}}>
                      <div style={{display:'inline-block',padding:'.85rem 2rem',background:'linear-gradient(135deg,#FFD60A,#FF8C00)',color:'#050508',fontWeight:800,borderRadius:8,fontSize:'1rem'}}>Mark as Posted</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   COLLABORATOR & CAMPAIGN MODALS
   ============================================================ */
function CollaboratorModal({collab, onSave, onClose}) {
  const [data, setData] = useState({
    name: collab.name||'', handle: collab.handle||'', email: collab.email||'',
    platform: collab.platform||'ig', timezone: collab.timezone||'EST (UTC-5)',
    tier: collab.tier||'Bronze', level: collab.level||'Influencer',
    followers: collab.followers||'', engagement: collab.engagement||0,
    status: collab.status||'active', tags: (collab.tags||[]).join(', '),
    id: collab.id
  });
  const u = (k,v) => setData(p => ({...p, [k]:v}));
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',zIndex:200,display:'grid',placeItems:'start center',paddingTop:'10vh'}} onClick={onClose}>
      <div style={{width:'min(560px,90vw)',background:'var(--bg-solid)',border:'1px solid var(--border-strong)',borderRadius:'var(--radius-xl)',padding:'1.5rem',boxShadow:'0 20px 60px rgba(0,0,0,.5),var(--glow-md)',maxHeight:'80vh',overflowY:'auto'}} onClick={e => e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}>
          <h3 style={{fontFamily:'var(--display)',fontSize:'1.2rem'}}>{collab.id ? 'Edit Collaborator' : 'Add Collaborator'}</h3>
          <button className="icon-btn" onClick={onClose} style={{width:28,height:28}}>{Icons.x}</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.75rem'}}>
          <label className="field"><span className="lbl">Name *</span><input className="input" value={data.name} onChange={e => u('name',e.target.value)} /></label>
          <label className="field"><span className="lbl">Handle *</span><input className="input" placeholder="@username" value={data.handle} onChange={e => u('handle',e.target.value)} /></label>
          <label className="field"><span className="lbl">Email *</span><input className="input" type="email" value={data.email} onChange={e => u('email',e.target.value)} /></label>
          <label className="field"><span className="lbl">Followers</span><input className="input" placeholder="285K" value={data.followers} onChange={e => u('followers',e.target.value)} /></label>
          <label className="field"><span className="lbl">Platform</span>
            <select className="input" value={data.platform} onChange={e => u('platform',e.target.value)}>
              <option value="ig">Instagram</option><option value="tt">TikTok</option><option value="yt">YouTube</option><option value="li">LinkedIn</option><option value="fb">Facebook</option>
            </select>
          </label>
          <label className="field"><span className="lbl">Timezone</span>
            <select className="input" value={data.timezone} onChange={e => u('timezone',e.target.value)}>
              <option>PST (UTC-8)</option><option>MST (UTC-7)</option><option>CST (UTC-6)</option><option>EST (UTC-5)</option><option>GMT (UTC+0)</option><option>CET (UTC+1)</option><option>GST (UTC+4)</option><option>JST (UTC+9)</option>
            </select>
          </label>
          <label className="field"><span className="lbl">Tier</span>
            <select className="input" value={data.tier} onChange={e => u('tier',e.target.value)}>
              <option>Bronze</option><option>Silver</option><option>Gold</option><option>Platinum</option>
            </select>
          </label>
          <label className="field"><span className="lbl">Level</span>
            <select className="input" value={data.level} onChange={e => u('level',e.target.value)}>
              <option>Influencer</option><option>Ambassador</option><option>Partner</option><option>Affiliate</option>
            </select>
          </label>
          <label className="field"><span className="lbl">Engagement %</span><input className="input" type="number" step="0.1" value={data.engagement} onChange={e => u('engagement',e.target.value)} /></label>
          <label className="field"><span className="lbl">Status</span>
            <select className="input" value={data.status} onChange={e => u('status',e.target.value)}>
              <option value="active">Active</option><option value="invited">Invited</option><option value="paused">Paused</option>
            </select>
          </label>
        </div>
        <label className="field" style={{marginTop:'.5rem'}}><span className="lbl">Tags (comma separated)</span><input className="input" value={data.tags} onChange={e => u('tags',e.target.value)} placeholder="lifestyle, tech, AI" /></label>
        <div style={{display:'flex',gap:'.5rem',marginTop:'1rem'}}>
          <button className="btn btn-primary" style={{flex:1}} disabled={!data.name||!data.email} onClick={() => onSave({...data, tags: data.tags.split(',').map(t=>t.trim()).filter(Boolean), engagement: parseFloat(data.engagement)||0})}>{collab.id ? 'Update' : 'Add Collaborator'}</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function CampaignModal({camp, collaborators, onSave, onClose}) {
  const [data, setData] = useState({
    id: camp.id, name: camp.name||'', status: camp.status||'draft',
    start_date: camp.start_date||'', end_date: camp.end_date||'',
    collaborator_ids: camp.collaborator_ids || camp.collaborators || [],
    content_ids: camp.content_ids || []
  });
  const u = (k,v) => setData(p => ({...p, [k]:v}));
  const toggleCollab = (id) => setData(p => ({...p, collaborator_ids: p.collaborator_ids.includes(id) ? p.collaborator_ids.filter(c => c !== id) : [...p.collaborator_ids, id]}));
  const toggleContent = (id) => setData(p => ({...p, content_ids: p.content_ids.includes(id) ? p.content_ids.filter(c => c !== id) : [...p.content_ids, id]}));
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',zIndex:200,display:'grid',placeItems:'start center',paddingTop:'8vh'}} onClick={onClose}>
      <div style={{width:'min(720px,95vw)',background:'var(--bg-solid)',border:'1px solid var(--border-strong)',borderRadius:'var(--radius-xl)',padding:'1.5rem',boxShadow:'0 20px 60px rgba(0,0,0,.5),var(--glow-md)',maxHeight:'85vh',overflowY:'auto'}} onClick={e => e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}>
          <h3 style={{fontFamily:'var(--display)',fontSize:'1.2rem'}}>{camp.id ? 'Edit Campaign' : 'New Campaign'}</h3>
          <button className="icon-btn" onClick={onClose} style={{width:28,height:28}}>{Icons.x}</button>
        </div>
        <label className="field"><span className="lbl">Campaign Name *</span><input className="input" value={data.name} onChange={e => u('name',e.target.value)} placeholder="e.g., AI Tools Launch Sprint" autoFocus /></label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'.75rem'}}>
          <label className="field"><span className="lbl">Start Date</span><input className="input" type="date" value={data.start_date} onChange={e => u('start_date',e.target.value)} /></label>
          <label className="field"><span className="lbl">End Date</span><input className="input" type="date" value={data.end_date} onChange={e => u('end_date',e.target.value)} /></label>
          <label className="field"><span className="lbl">Status</span>
            <select className="input" value={data.status} onChange={e => u('status',e.target.value)}>
              <option value="draft">Draft</option><option value="active">Active</option><option value="completed">Completed</option>
            </select>
          </label>
        </div>
        <label className="field"><span className="lbl">Content Pieces ({data.content_ids.length} selected)</span>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.35rem',maxHeight:140,overflowY:'auto',padding:'.5rem',background:'var(--glass)',borderRadius:'var(--radius-lg)',border:'1px solid var(--glass-border)'}}>
            {MOCK_CONTENT.map(c => (
              <label key={c.id} style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.35rem .5rem',background:data.content_ids.includes(c.id)?'rgba(255,214,10,0.08)':'transparent',borderRadius:'var(--radius)',cursor:'pointer',fontSize:'.78rem'}}>
                <input type="checkbox" checked={data.content_ids.includes(c.id)} onChange={() => toggleContent(c.id)} style={{accentColor:'var(--yellow)'}} />
                <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title}</span>
              </label>
            ))}
          </div>
        </label>
        <label className="field"><span className="lbl">Collaborators ({data.collaborator_ids.length} selected)</span>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.35rem',maxHeight:200,overflowY:'auto',padding:'.5rem',background:'var(--glass)',borderRadius:'var(--radius-lg)',border:'1px solid var(--glass-border)'}}>
            {collaborators.map(c => (
              <label key={c.id} style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.4rem .5rem',background:data.collaborator_ids.includes(c.id)?'rgba(255,214,10,0.08)':'transparent',borderRadius:'var(--radius)',cursor:'pointer',fontSize:'.78rem'}}>
                <input type="checkbox" checked={data.collaborator_ids.includes(c.id)} onChange={() => toggleCollab(c.id)} style={{accentColor:'var(--yellow)'}} />
                <div style={{width:24,height:24,borderRadius:'50%',background:'var(--gradient-warm)',display:'grid',placeItems:'center',fontFamily:'var(--display)',fontWeight:900,fontSize:'.62rem',color:'var(--ink)',flexShrink:0}}>{c.photo}</div>
                <span style={{flex:1,fontSize:'.75rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</span>
                <span className={`platform-badge ${c.platform}`} style={{fontSize:'.55rem',padding:'.1rem .25rem'}}>{c.platform.toUpperCase()}</span>
              </label>
            ))}
          </div>
        </label>
        <div style={{display:'flex',gap:'.5rem',marginTop:'1rem'}}>
          <button className="btn btn-primary" style={{flex:1}} disabled={!data.name} onClick={() => onSave(data)}>{camp.id ? 'Update Campaign' : 'Create Campaign'}</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN RECORD STUDIO — real MediaRecorder + multi-screen
   ============================================================ */
function ScreenRecordView() {
  const {addToast, latestStrategy, setVaultOpen, setVaultLoadHandler} = useApp();
  const [screens, setScreens] = useState([]);
  const [cameraStream, setCameraStream] = useState(null);
  const [recording, setRecording] = useState(false);
  const [recordedChunks, setRecordedChunks] = useState([]);
  const [recordedUrl, setRecordedUrl] = useState(null);
  const [duration, setDuration] = useState(0);
  const [layout, setLayout] = useState('single'); // single, split, triple, pip
  const [includeMic, setIncludeMic] = useState(true);
  const [includeCamera, setIncludeCamera] = useState(true);
  const [includeSystemAudio, setIncludeSystemAudio] = useState(true);
  const [prompterOn, setPrompterOn] = useState(false);
  const [prompterScript, setPrompterScript] = useState(`Most people think AI automation is about saving time.\nIt's actually about making decisions you didn't know you were missing.\n\nHere's what changed when I deployed my first AI agent...\n\nDecision Velocity. The Invisible Bottleneck. Compound Intelligence.\n\nYou don't need AI to do your job faster.\nYou need AI to do the job you didn't know existed.\n\nComment "DECISIONS" and I'll send you the full framework.`);
  const [prompterPos, setPrompterPos] = useState({x: 60, y: 60});
  const [prompterOpacity, setPrompterOpacity] = useState(0.85);
  const [prompterFontSize, setPrompterFontSize] = useState(22);
  const [prompterScrollSpeed, setPrompterScrollSpeed] = useState(0);
  const [prompterScrollPos, setPrompterScrollPos] = useState(0);
  const recorderRef = useRef(null);
  const canvasRef = useRef(null);
  const timerRef = useRef(null);
  const prompterScrollRef = useRef(null);

  const isMobile = /iPad|iPhone|iPod|Android/i.test(navigator.userAgent);
  const supportsScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

  // Add a screen source
  const addScreen = async () => {
    if (screens.length >= 3) { addToast('Maximum 3 screens supported','info'); return; }
    if (!supportsScreen) { addToast('Screen capture not supported on this device. Use desktop browser or iOS Control Center.','error'); return; }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: {frameRate: {ideal: 30, max: 60}},
        audio: includeSystemAudio
      });
      const id = Date.now();
      setScreens(prev => [...prev, {id, stream, label: `Screen ${prev.length+1}`}]);
      // Auto-stop handler
      stream.getVideoTracks()[0].addEventListener('ended', () => {
        setScreens(prev => prev.filter(s => s.id !== id));
      });
      addToast(`Screen ${screens.length+1} added`,'success');
      // Auto-update layout
      const newCount = screens.length + 1;
      if (newCount === 2) setLayout('split');
      else if (newCount === 3) setLayout('triple');
      else if (newCount === 1) setLayout('single');
    } catch(e) {
      if (e.name !== 'NotAllowedError') addToast('Screen capture failed: '+e.message,'error');
    }
  };

  const removeScreen = (id) => {
    setScreens(prev => {
      const s = prev.find(x => x.id === id);
      if (s) s.stream.getTracks().forEach(t => t.stop());
      const next = prev.filter(x => x.id !== id);
      if (next.length === 1) setLayout('single');
      else if (next.length === 2) setLayout('split');
      return next;
    });
  };

  const toggleCamera = async () => {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      setCameraStream(null);
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {width: 640, height: 480, facingMode: 'user'},
        audio: false
      });
      setCameraStream(stream);
      addToast('Camera ready','success');
    } catch(e) {
      addToast('Camera access denied','error');
    }
  };

  // Compose all sources onto a canvas for recording
  const composeAndRecord = async () => {
    if (screens.length === 0) { addToast('Add at least one screen first','error'); return; }
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    canvas.width = 1920;
    canvas.height = 1080;

    // Create video elements for each screen
    const videos = screens.map(s => {
      const v = document.createElement('video');
      v.srcObject = s.stream;
      v.muted = true;
      v.play();
      return v;
    });
    let cameraVideo = null;
    if (cameraStream && includeCamera) {
      cameraVideo = document.createElement('video');
      cameraVideo.srcObject = cameraStream;
      cameraVideo.muted = true;
      cameraVideo.play();
    }

    // Wait for videos to be ready
    await new Promise(r => setTimeout(r, 500));

    // Draw loop
    let stopDraw = false;
    const draw = () => {
      if (stopDraw) return;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (layout === 'single' || screens.length === 1) {
        ctx.drawImage(videos[0], 0, 0, canvas.width, canvas.height);
      } else if (layout === 'split' && screens.length >= 2) {
        const w = canvas.width / 2;
        ctx.drawImage(videos[0], 0, 0, w, canvas.height);
        ctx.drawImage(videos[1], w, 0, w, canvas.height);
        ctx.fillStyle = '#FFD60A';
        ctx.fillRect(w-1, 0, 2, canvas.height);
      } else if (layout === 'triple' && screens.length >= 3) {
        const w = canvas.width / 2;
        const h = canvas.height / 2;
        ctx.drawImage(videos[0], 0, 0, w, h);
        ctx.drawImage(videos[1], w, 0, w, h);
        ctx.drawImage(videos[2], 0, h, canvas.width, h);
      } else if (layout === 'pip') {
        ctx.drawImage(videos[0], 0, 0, canvas.width, canvas.height);
      }

      // PiP camera overlay
      if (cameraVideo && includeCamera) {
        const camW = 280, camH = 210;
        const camX = canvas.width - camW - 32;
        const camY = canvas.height - camH - 32;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(camX, camY, camW, camH, 16);
        ctx.clip();
        ctx.drawImage(cameraVideo, camX, camY, camW, camH);
        ctx.restore();
        // Yellow border
        ctx.strokeStyle = '#FFD60A';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(camX, camY, camW, camH, 16);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    };
    draw();

    // Build combined audio stream
    const audioTracks = [];
    if (includeMic) {
      try {
        const micStream = await navigator.mediaDevices.getUserMedia({audio: true});
        audioTracks.push(...micStream.getAudioTracks());
      } catch(e) { console.warn('mic denied'); }
    }
    if (includeSystemAudio) {
      screens.forEach(s => audioTracks.push(...s.stream.getAudioTracks()));
    }

    const canvasStream = canvas.captureStream(30);
    const finalStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...audioTracks
    ]);

    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const recorder = new MediaRecorder(finalStream, {mimeType, videoBitsPerSecond: 5000000});
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      stopDraw = true;
      const blob = new Blob(chunks, {type: 'video/webm'});
      setRecordedChunks(chunks);
      setRecordedUrl(URL.createObjectURL(blob));
      addToast('Recording complete! Click Download to save.','success');
    };
    recorder.start(1000);
    recorderRef.current = recorder;
    setRecording(true);
    setDuration(0);
    timerRef.current = setInterval(() => setDuration(d => d+1), 1000);
  };

  const stopRecording = () => {
    if (recorderRef.current && recorderRef.current.state === 'recording') {
      recorderRef.current.stop();
      recorderRef.current.stream.getTracks().forEach(t => t.stop());
    }
    setRecording(false);
    clearInterval(timerRef.current);
  };

  const downloadRecording = () => {
    if (!recordedUrl) return;
    const a = document.createElement('a');
    a.href = recordedUrl;
    a.download = `supernova-recording-${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // Auto-scroll teleprompter
  useEffect(() => {
    if (!prompterOn || prompterScrollSpeed === 0) return;
    const id = setInterval(() => {
      setPrompterScrollPos(p => p + prompterScrollSpeed * 0.5);
    }, 50);
    return () => clearInterval(id);
  }, [prompterOn, prompterScrollSpeed]);

  // Cleanup
  useEffect(() => () => {
    screens.forEach(s => s.stream.getTracks().forEach(t => t.stop()));
    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    if (recordedUrl) URL.revokeObjectURL(recordedUrl);
  }, []);

  // Register the load handler so Vault knows where to send scripts
  useEffect(() => {
    setVaultLoadHandler(() => (text) => {
      setPrompterScript(text);
      setPrompterOn(true);
      setPrompterScrollPos(0);
    });
    return () => setVaultLoadHandler(null);
  }, []);

  const fmtTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

  return (
    <div className="view-enter">
      <div className="view-head">
        <div>
          <h1>Screen Record Studio</h1>
          <div className="sub">{recording ? <span style={{color:'var(--red)'}}>● RECORDING — {fmtTime(duration)}</span> : 'Multi-screen capture with live teleprompter overlay'}</div>
        </div>
        <div style={{display:'flex',gap:'.5rem'}}>
          <button className="btn btn-ghost btn-sm" onClick={() => setVaultOpen(true)}>📚 Strategy Vault</button>
          {!recording && screens.length > 0 && <button className="btn btn-primary" onClick={composeAndRecord} style={{background:'var(--red)',color:'#fff'}}>● Start Recording</button>}
          {recording && <button className="btn btn-primary" onClick={stopRecording}>■ Stop</button>}
          {recordedUrl && !recording && <button className="btn btn-primary" onClick={downloadRecording}>{Icons.download} Download</button>}
        </div>
      </div>

      {isMobile && (
        <div className="card" style={{borderColor:'var(--amber)',background:'rgba(255,140,0,0.05)',marginBottom:'1.25rem'}}>
          <div style={{fontWeight:700,color:'var(--amber)',marginBottom:'.35rem'}}>📱 Mobile Note</div>
          <div style={{fontSize:'.85rem',color:'var(--text-muted)',lineHeight:1.6}}>iOS doesn't allow in-browser screen capture. Use Control Center → Screen Recording, then upload the .mov to Editor for teleprompter overlay editing. Android Chrome supports getDisplayMedia for tab/window capture only.</div>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:'1.25rem'}}>
        {/* MAIN: Live preview + recorded playback */}
        <div>
          <div className="card" style={{padding:0,overflow:'hidden',marginBottom:'1rem',position:'relative'}}>
            <div style={{aspectRatio:'16/9',background:'#000',position:'relative',overflow:'hidden'}}>
              {/* Live preview tiles */}
              {screens.length === 0 && !recordedUrl && (
                <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',color:'var(--text-dim)',textAlign:'center'}}>
                  <div>
                    <div style={{fontSize:'3rem',opacity:.3,marginBottom:'.75rem'}}>🖥️</div>
                    <div style={{fontFamily:'var(--display)',fontSize:'1.2rem',fontWeight:700,marginBottom:'.25rem'}}>No screens captured</div>
                    <div style={{fontFamily:'var(--mono)',fontSize:'.78rem'}}>Click "+ Add Screen" to begin</div>
                  </div>
                </div>
              )}
              <div style={{position:'absolute',inset:0,display:'grid',gridTemplateColumns: layout==='split'?'1fr 1fr' : layout==='triple'?'1fr 1fr':'1fr', gridTemplateRows: layout==='triple'?'1fr 1fr':'1fr', gap:2}}>
                {screens.map((s, i) => (
                  <div key={s.id} style={{background:'#111',position:'relative',gridColumn: layout==='triple'&&i===2?'1 / span 2':undefined}}>
                    <video ref={el => {if(el && el.srcObject !== s.stream){el.srcObject=s.stream;el.play();}}} autoPlay muted style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    <div style={{position:'absolute',top:8,left:8,padding:'.25rem .5rem',background:'rgba(0,0,0,.7)',borderRadius:4,fontFamily:'var(--mono)',fontSize:'.65rem',color:'#fff',backdropFilter:'blur(4px)'}}>{s.label}</div>
                    <button onClick={() => removeScreen(s.id)} style={{position:'absolute',top:8,right:8,width:24,height:24,borderRadius:'50%',background:'rgba(0,0,0,.7)',color:'#fff',border:'none',cursor:'pointer',display:'grid',placeItems:'center',fontSize:'.7rem'}}>x</button>
                  </div>
                ))}
              </div>

              {/* PiP Camera overlay */}
              {cameraStream && includeCamera && (
                <div style={{position:'absolute',bottom:24,right:24,width:200,height:150,borderRadius:12,overflow:'hidden',border:'3px solid var(--yellow)',boxShadow:'var(--glow-md)',zIndex:5}}>
                  <video ref={el => {if(el && el.srcObject !== cameraStream){el.srcObject=cameraStream;el.play();}}} autoPlay muted playsInline style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                </div>
              )}

              {/* Floating Teleprompter */}
              {prompterOn && (
                <div style={{position:'absolute',left:prompterPos.x,top:prompterPos.y,width:480,maxHeight:280,padding:'1rem 1.25rem',background:`rgba(0,0,0,${prompterOpacity})`,backdropFilter:'blur(8px)',borderRadius:12,border:'1px solid rgba(255,214,10,0.3)',color:'#fff',cursor:'move',overflow:'hidden',zIndex:6}} draggable onDragEnd={(e) => { if (e.clientX > 0) setPrompterPos({x: e.clientX - 100, y: e.clientY - 30}); }}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.5rem',paddingBottom:'.4rem',borderBottom:'1px solid rgba(255,214,10,0.2)'}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:'.65rem',color:'var(--yellow)',letterSpacing:'.1em'}}>● TELEPROMPTER</span>
                    <button onClick={() => setPrompterOn(false)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.6)',cursor:'pointer',fontSize:'.85rem'}}>×</button>
                  </div>
                  <div ref={prompterScrollRef} style={{maxHeight:200,overflow:'hidden',fontSize:prompterFontSize,lineHeight:1.5,fontFamily:'var(--body)'}}>
                    <div style={{transform:`translateY(-${prompterScrollPos}px)`,transition: prompterScrollSpeed > 0 ? 'transform .5s linear' : 'none',whiteSpace:'pre-wrap'}}>{prompterScript}</div>
                  </div>
                </div>
              )}
            </div>

            {/* Recorded playback */}
            {recordedUrl && !recording && (
              <div style={{padding:'1rem',borderTop:'1px solid var(--border)',background:'var(--glass)'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:'.7rem',color:'var(--green)',marginBottom:'.5rem',letterSpacing:'.1em'}}>● RECORDING SAVED</div>
                <video src={recordedUrl} controls style={{width:'100%',maxHeight:300,borderRadius:8,background:'#000'}}></video>
              </div>
            )}
          </div>

          {/* Hidden composition canvas */}
          <canvas ref={canvasRef} style={{display:'none'}}></canvas>

          {/* Layout selector */}
          <div className="card">
            <div className="card-head"><h3>Layout</h3><span style={{fontFamily:'var(--mono)',fontSize:'.7rem',color:'var(--text-dim)'}}>{screens.length}/3 screens</span></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'.5rem'}}>
              {[
                {k:'single',l:'Single',d:'1 screen'},
                {k:'split',l:'Split',d:'2 side-by-side'},
                {k:'triple',l:'Triple',d:'2 top + 1 bottom'},
                {k:'pip',l:'PiP',d:'Screen + camera bubble'},
              ].map(opt => (
                <button key={opt.k} onClick={() => setLayout(opt.k)} className={`btn btn-sm ${layout===opt.k?'btn-primary':'btn-ghost'}`} style={{flexDirection:'column',gap:'.15rem',padding:'.65rem'}}>
                  <span>{opt.l}</span>
                  <span style={{fontFamily:'var(--mono)',fontSize:'.6rem',opacity:.7}}>{opt.d}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* CONTROLS */}
        <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
          <div className="card">
            <div className="card-head"><h3>Sources</h3></div>
            <button className="btn btn-primary" style={{width:'100%',marginBottom:'.5rem'}} onClick={addScreen} disabled={recording || screens.length >= 3}>+ Add Screen ({screens.length}/3)</button>
            <button className={`btn btn-sm ${cameraStream?'btn-primary':'btn-ghost'}`} style={{width:'100%',marginBottom:'.5rem'}} onClick={toggleCamera} disabled={recording}>
              {cameraStream ? '✓ Camera ON' : '+ Add Camera'}
            </button>
            <label style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.5rem .65rem',background:'var(--glass)',borderRadius:'var(--radius-lg)',marginBottom:'.35rem',cursor:'pointer',fontSize:'.82rem'}}>
              <input type="checkbox" checked={includeMic} onChange={e=>setIncludeMic(e.target.checked)} style={{accentColor:'var(--yellow)'}} />
              🎤 Microphone audio
            </label>
            <label style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.5rem .65rem',background:'var(--glass)',borderRadius:'var(--radius-lg)',marginBottom:'.35rem',cursor:'pointer',fontSize:'.82rem'}}>
              <input type="checkbox" checked={includeSystemAudio} onChange={e=>setIncludeSystemAudio(e.target.checked)} style={{accentColor:'var(--yellow)'}} />
              🔊 System audio (Chrome/Edge only)
            </label>
            <label style={{display:'flex',alignItems:'center',gap:'.5rem',padding:'.5rem .65rem',background:'var(--glass)',borderRadius:'var(--radius-lg)',cursor:'pointer',fontSize:'.82rem'}}>
              <input type="checkbox" checked={includeCamera} onChange={e=>setIncludeCamera(e.target.checked)} style={{accentColor:'var(--yellow)'}} />
              📹 Burn camera into video
            </label>
          </div>

          <div className="card">
            <div className="card-head"><h3>Teleprompter</h3>
              <button className={`btn btn-sm ${prompterOn?'btn-primary':'btn-ghost'}`} onClick={() => setPrompterOn(!prompterOn)}>{prompterOn ? 'ON' : 'OFF'}</button>
            </div>
            {latestStrategy && (
              <div style={{padding:'.6rem .75rem',background:'rgba(0,230,138,0.08)',border:'1px solid rgba(0,230,138,0.3)',borderRadius:'var(--radius-lg)',marginBottom:'.75rem'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:'.6rem',color:'var(--green)',letterSpacing:'.12em',marginBottom:'.25rem',fontWeight:700}}>● JUST GENERATED</div>
                <div style={{fontSize:'.8rem',fontWeight:600,marginBottom:'.5rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{latestStrategy.topic || latestStrategy.title}</div>
                <div style={{display:'flex',gap:'.35rem'}}>
                  <button className="btn btn-primary btn-sm" style={{flex:1,fontSize:'.7rem',padding:'.3rem .5rem'}} onClick={() => setVaultOpen(true)}>Pick Section</button>
                  <button className="btn btn-ghost btn-sm" style={{flex:1,fontSize:'.7rem',padding:'.3rem .5rem'}} onClick={() => {setPrompterScript(latestStrategy.output || latestStrategy.brief?.output || ''); setPrompterOn(true); addToast('Full strategy loaded','success');}}>Load Full</button>
                </div>
              </div>
            )}
            {prompterOn && (
              <>
                <label className="field"><span className="lbl">Script</span><textarea className="input" value={prompterScript} onChange={e => setPrompterScript(e.target.value)} style={{minHeight:120,fontFamily:'var(--body)',fontSize:'.85rem',resize:'vertical'}} /></label>
                <label className="field"><span className="lbl">Font: {prompterFontSize}px</span>
                  <input type="range" min="14" max="48" value={prompterFontSize} onChange={e => setPrompterFontSize(+e.target.value)} style={{width:'100%',accentColor:'var(--yellow)'}} />
                </label>
                <label className="field"><span className="lbl">Opacity: {Math.round(prompterOpacity*100)}%</span>
                  <input type="range" min="0.3" max="1" step="0.05" value={prompterOpacity} onChange={e => setPrompterOpacity(+e.target.value)} style={{width:'100%',accentColor:'var(--yellow)'}} />
                </label>
                <label className="field"><span className="lbl">Auto-scroll: {prompterScrollSpeed}x</span>
                  <input type="range" min="0" max="5" step="0.5" value={prompterScrollSpeed} onChange={e => setPrompterScrollSpeed(+e.target.value)} style={{width:'100%',accentColor:'var(--yellow)'}} />
                </label>
                <button className="btn btn-ghost btn-sm" style={{width:'100%'}} onClick={() => setPrompterScrollPos(0)}>Reset Scroll</button>
                <div style={{fontFamily:'var(--mono)',fontSize:'.65rem',color:'var(--text-dim)',marginTop:'.5rem',padding:'.5rem',background:'var(--glass)',borderRadius:'var(--radius)'}}>
                  💡 The teleprompter is part of the recording. For an OFF-recording prompter, open this app on a 2nd monitor, drag prompter there, then capture only the 1st monitor.
                </div>
              </>
            )}
          </div>

          <div className="card">
            <div className="card-head"><h3>Quality & Format</h3></div>
            <label className="field"><span className="lbl">Resolution</span>
              <select className="input" defaultValue="1080p">
                <option value="720p">720p HD</option>
                <option value="1080p">1080p Full HD</option>
                <option value="1440p">1440p 2K</option>
                <option value="2160p">2160p 4K</option>
              </select>
            </label>
            <label className="field"><span className="lbl">Format</span>
              <select className="input" defaultValue="webm">
                <option value="webm">WebM (VP9 + Opus) — universal</option>
                <option value="mp4" disabled>MP4 (coming soon)</option>
              </select>
            </label>
            <label className="field"><span className="lbl">Frame Rate</span>
              <select className="input" defaultValue="30">
                <option value="24">24 fps (cinematic)</option>
                <option value="30">30 fps (standard)</option>
                <option value="60">60 fps (smooth)</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   COMMENT MONITOR — Auto-moderate comments across platforms
   ============================================================ */

/* ============================================================
   STRATEGY VAULT — shared drawer for Engine + Recorder
   ============================================================ */
function parseScripts(output) {
  // Parse the strategy output text into named sections
  if (!output) return [];
  const sections = [];
  const lines = output.split('\n');
  let currentSection = null;
  let currentText = [];
  const flush = () => {
    if (currentSection) {
      sections.push({
        id: currentSection.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
        name: currentSection,
        text: currentText.join('\n').trim()
      });
    }
  };
  for (const line of lines) {
    // Headers: ALL CAPS section markers like "RECOMMENDED HOOK", "CONTRARIAN TAKE", etc.
    if (/^[A-Z][A-Z\s&]+$/.test(line.trim()) && line.trim().length > 3 && line.trim().length < 50) {
      flush();
      currentSection = line.trim();
      currentText = [];
    } else {
      currentText.push(line);
    }
  }
  flush();
  // Always include a "Full Strategy" section at the end
  sections.push({id: 'full', name: 'Full Strategy', text: output.trim()});
  return sections.filter(s => s.text.length > 0);
}

function StrategyVaultDrawer() {
  const {vaultOpen, setVaultOpen, vaultLoadHandler, addToast, view} = useApp();
  const [strategies, setStrategies] = useState([]);
  const [loading, setLoading] = useState(false);
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [selectedSection, setSelectedSection] = useState(null);
  const [recentIds, setRecentIds] = useState(() => {
    try { return JSON.parse(localStorage.getItem('eos-vault-recent') || '[]'); } catch(e){ return []; }
  });

  // Fetch strategies when drawer opens
  useEffect(() => {
    if (!vaultOpen) return;
    const sb = window.SupabaseClient;
    if (!sb || !sb.isReady()) {
      // Fallback: localStorage cache
      try {
        const cached = JSON.parse(localStorage.getItem('eos-strategies-local') || '[]');
        setStrategies(cached);
      } catch(e) {}
      return;
    }
    setLoading(true);
    (async () => {
      const wsId = sb.getWorkspaceId();
      const data = await sb.fetch('content', {eq: {type:'strategy', ...(wsId?{workspace_id:wsId}:{})}, order:'created_at', ascending:false, limit:100});
      if (data) setStrategies(data);
      setLoading(false);
    })();
  }, [vaultOpen]);

  const markRecent = (id) => {
    const next = [id, ...recentIds.filter(r => r !== id)].slice(0, 5);
    setRecentIds(next);
    localStorage.setItem('eos-vault-recent', JSON.stringify(next));
  };

  const filteredStrategies = strategies.filter(s => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (s.title || '').toLowerCase().includes(q) || (s.brief?.topic || '').toLowerCase().includes(q);
  });

  const recents = recentIds.map(id => strategies.find(s => s.id === id)).filter(Boolean);

  const sections = selected ? parseScripts(selected.brief?.output || '') : [];

  const loadToTeleprompter = (text) => {
    if (vaultLoadHandler) {
      vaultLoadHandler(text);
      addToast('Loaded into teleprompter','success');
      setVaultOpen(false);
    } else {
      addToast('Open Screen Record to load into teleprompter','info');
    }
  };

  const copyToClipboard = (text) => {
    navigator.clipboard.writeText(text);
    addToast('Copied to clipboard','success');
  };

  if (!vaultOpen) return null;

  return (
    <>
      <div onClick={() => setVaultOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.55)',backdropFilter:'blur(6px)',zIndex:90}}></div>
      <div style={{position:'fixed',top:0,right:0,width:'min(540px,100vw)',height:'100vh',background:'var(--bg-solid)',borderLeft:'1px solid var(--border-strong)',zIndex:95,display:'flex',flexDirection:'column',boxShadow:'-20px 0 80px rgba(0,0,0,.5)',animation:'fadeUp .25s ease'}}>

          </div>
          <button className="icon-btn" onClick={() => setVaultOpen(false)} style={{width:32,height:32}}>{Icons.x}</button>
        </div>

        {/* BREADCRUMB */}
        {(selected || selectedSection) && (
          <div style={{padding:'.6rem 1.25rem',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:'.5rem',fontSize:'.8rem'}}>
            <button className="btn btn-ghost btn-sm" style={{padding:'.2rem .5rem',fontSize:'.7rem'}} onClick={() => {if(selectedSection){setSelectedSection(null)}else{setSelected(null)}}}>← Back</button>

                  <div style={{fontWeight:600,fontSize:'.9rem',marginBottom:'.2rem'}}>{s.title || s.brief?.topic || 'Untitled'}</div>
                  <div style={{display:'flex',gap:'.5rem',alignItems:'center',fontSize:'.7rem',color:'var(--text-dim)',fontFamily:'var(--mono)'}}>

                    <span>•</span>

   ============================================================ */
function LeadMagnetView({magnetId}) {
  const [strategy, setStrategy] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [email, setEmail] = useState('');
  const [signupOk, setSignupOk] = useState(false);

  useEffect(() => {
    (async () => {
      // Try local first
      try {
        const cached = JSON.parse(localStorage.getItem('eos-strategies-local') || '[]');
        const local = cached.find(s => s.id === magnetId);
        if (local) { setStrategy(local); setLoading(false); return; }
      } catch(e){}
      // Then Supabase (use anon, public read on content table per RLS)
      if (window.SupabaseClient && window.SupabaseClient.isReady()) {
        const data = await window.SupabaseClient.fetch('content', {eq:{id: magnetId}, limit:1});
        if (data && data[0]) { setStrategy(data[0]); setLoading(false); return; }
      }
      setError('Strategy not found');
      setLoading(false);
    })();
  }, [magnetId]);

  const sections = strategy ? parseScripts(strategy.brief?.output || strategy.output || '') : [];
  const topic = strategy?.title || strategy?.brief?.topic || strategy?.topic || 'Strategy';

  if (loading) return <div style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'var(--bg)',color:'var(--text-dim)'}}>Loading strategy...</div>;
  if (error) return <div style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'var(--bg)',color:'var(--red)'}}>{error}</div>;

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)'}}>
      {/* HERO */}
      <div style={{background:'linear-gradient(135deg,#FFD60A 0%,#FF8C00 50%,#FF5722 100%)',padding:'3rem 2rem 4rem',position:'relative',overflow:'hidden'}}>
        <div style={{maxWidth:780,margin:'0 auto'}}>
          <div style={{fontFamily:'var(--display)',fontWeight:900,fontSize:'1.1rem',color:'var(--ink)',letterSpacing:'.02em',marginBottom:'.75rem'}}>SUPERNOVA EDITOR · STRATEGY</div>
          <h1 style={{fontFamily:'var(--display)',fontWeight:800,fontSize:'clamp(2rem,5vw,3.5rem)',lineHeight:1,letterSpacing:'-0.03em',color:'var(--ink)',margin:0}}>{topic}</h1>
          <div style={{fontFamily:'var(--mono)',fontSize:'.8rem',color:'rgba(10,10,20,.7)',marginTop:'1rem',letterSpacing:'.05em'}}>{(strategy.brief?.contentType||'short').toUpperCase()}-FORM CONTENT STRATEGY · {sections.length} SECTIONS</div>
        </div>
      </div>

      {/* SECTIONS */}
      <div style={{maxWidth:780,margin:'-2rem auto 4rem',padding:'0 2rem',position:'relative'}}>
        {sections.map((sec, i) => (
          <div key={sec.id} style={{background:'var(--bg-solid)',border:'1px solid var(--border)',borderRadius:'var(--radius-xl)',padding:'1.75rem 2rem',marginBottom:'1rem',boxShadow:i===0?'0 8px 32px rgba(255,214,10,0.1)':'none'}}>
            <div style={{fontFamily:'var(--mono)',fontSize:'.7rem',color:'var(--yellow)',letterSpacing:'.15em',marginBottom:'.5rem',fontWeight:700}}>SECTION {i+1}</div>
            <h2 style={{fontFamily:'var(--display)',fontSize:'1.4rem',fontWeight:700,marginBottom:'1rem',letterSpacing:'-0.02em'}}>{sec.name}</h2>
            <div style={{fontFamily:'var(--body)',fontSize:'.95rem',lineHeight:1.7,color:'var(--text-muted)',whiteSpace:'pre-wrap'}}>{sec.text}</div>
          </div>
        ))}

        {/* SIGNUP CTA */}
        <div style={{background:'linear-gradient(135deg,rgba(255,214,10,0.1),rgba(255,140,0,0.05))',border:'1px solid rgba(255,214,10,0.3)',borderRadius:'var(--radius-xl)',padding:'2rem',marginTop:'2rem',textAlign:'center'}}>
          {!signupOk ? (
            <>
              <h3 style={{fontFamily:'var(--display)',fontSize:'1.4rem',fontWeight:700,marginBottom:'.5rem'}}>Want strategies like this for your content?</h3>
              <p style={{fontSize:'.95rem',color:'var(--text-muted)',marginBottom:'1.5rem'}}>Get the Supernova Editor — turn one topic into 46 production-ready assets.</p>
              <div style={{display:'flex',gap:'.5rem',maxWidth:420,margin:'0 auto'}}>
                <input className="input" type="email" placeholder="your@email.com" value={email} onChange={e => setEmail(e.target.value)} style={{flex:1}} />
                <button className="btn btn-primary" onClick={() => {if(!email||!email.includes('@')){return;} setSignupOk(true);}}>Get Access</button>
              </div>
            </>
          ) : (
            <>
              <div style={{fontSize:'2rem',marginBottom:'.5rem'}}>✓</div>
              <h3 style={{fontFamily:'var(--display)',fontSize:'1.3rem',fontWeight:700,marginBottom:'.5rem'}}>You're on the list!</h3>
              <p style={{fontSize:'.92rem',color:'var(--text-muted)'}}>We'll be in touch with access soon.</p>
            </>
          )}
        </div>

        <div style={{textAlign:'center',marginTop:'2rem',fontFamily:'var(--mono)',fontSize:'.72rem',color:'var(--text-dim)'}}>
          Generated by <a href="/" style={{color:'var(--yellow)'}}>Supernova Editor</a> · Content Operating System
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const {view} = useApp();
  // Lead magnet route — render standalone landing page if ?magnet= present
  const urlParams = typeof window !== 'undefined' ? new URLSearchParams(window.location.search) : null;
  const magnetId = urlParams?.get('magnet');
  if (magnetId) return <LeadMagnetView magnetId={magnetId} />;
  return (
    <>
      {view === 'landing' ? <LandingPage /> : <AppShell />}
      <ToastContainer />
      <CommandPalette />
      <StrategyVaultDrawer />
    </>
  );
}

ReactDOM.render(<AppProvider><App /></AppProvider>, document.getElementById('root'));
</script>
</body>
</html>
