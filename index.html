<style>
/* ============================================================
   SUPERNOVA DESIGN TOKENS
   ============================================================ */
:root, :root[data-theme="dark"] {
  --bg: #050508; --bg-elev: rgba(18,18,24,0.7); --bg-elev-2: rgba(26,26,35,0.6); --bg-elev-3: rgba(35,35,48,0.5);
  --bg-solid: #0C0C12; --bg-solid-2: #14141C;
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
  --text: #F5F5F0; --text-muted: #A0A0A8; --text-dim: #5A5A68;
  --yellow: #FFD60A; --yellow-hot: #FFE55C; --yellow-deep: #E6BE00;
  --yellow-glow: rgba(255,214,10,0.2); --yellow-glow-strong: rgba(255,214,10,0.45);
  --ink: #050508;
  --amber: #FF8C00; --green: #00E68A; --red: #FF3B5C; --magenta: #FF2D87; --blue: #4EA8FF;
  --purple: #8B5CF6; --cyan: #22D3EE;
  --grid-line: rgba(255,255,255,0.03);
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --glow-sm: 0 0 20px rgba(255,214,10,0.15);
  --glow-md: 0 0 40px rgba(255,214,10,0.2);
  --glow-lg: 0 0 80px rgba(255,214,10,0.25);
  --glow-xl: 0 4px 60px rgba(255,214,10,0.3), 0 0 120px rgba(255,214,10,0.1);
  --royal: #4169E1; --navy: #1B2A5C; --royal-glow: rgba(65,105,225,0.25);
  --gradient-brand: linear-gradient(135deg, #FFD60A 0%, #FF8C00 50%, #FF5722 100%);
  --gradient-brand-text: linear-gradient(90deg, #FFD60A, #FF8C00, #FF5722);
  --gradient-warm: linear-gradient(135deg, #FFD60A 0%, #FF8C00 100%);
  --gradient-fire: linear-gradient(135deg, #FF8C00 0%, #FF5722 100%);
  --gradient-accent: linear-gradient(135deg, #4169E1 0%, #1B2A5C 100%);
  --gradient-accent-text: linear-gradient(90deg, #5B8DEF, #4169E1, #1B2A5C);
  --gradient-supernova: linear-gradient(135deg, #FFD60A 0%, #FF8C00 30%, #FF5722 50%, #4169E1 80%, #1B2A5C 100%);
  --gradient-glass: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
:root[data-theme="light"] {
  --bg: #FAFAF5; --bg-elev: rgba(255,255,255,0.85); --bg-elev-2: rgba(245,243,235,0.8); --bg-elev-3: rgba(235,232,220,0.7);
  --bg-solid: #FFFFFF; --bg-solid-2: #F5F3EB;
  --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
  --text: #0A0A0A; --text-muted: #4A4A52; --text-dim: #8A8A95;
  --yellow: #E6B800; --yellow-hot: #FFD60A; --yellow-deep: #CC9E00;
  --yellow-glow: rgba(230,184,0,0.2); --yellow-glow-strong: rgba(230,184,0,0.35);
  --ink: #0A0A0A;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.06);
  --glow-sm: 0 0 20px rgba(230,184,0,0.1);
  --glow-md: 0 0 40px rgba(230,184,0,0.15);
  --glow-lg: 0 0 80px rgba(230,184,0,0.2);
  --glow-xl: 0 4px 60px rgba(230,184,0,0.25);
  --gradient-glass: linear-gradient(135deg, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.01) 100%);
  --grid-line: rgba(0,0,0,0.04);
}
:root {
  --display: 'Clash Display','Impact',sans-serif;
  --body: 'Satoshi',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono: 'JetBrains Mono',ui-monospace,monospace;
  --max: 1360px; --pad: clamp(1.25rem,4vw,2.5rem);
  --radius: 6px; --radius-lg: 12px; --radius-xl: 16px;
  --transition: 200ms cubic-bezier(0.2,0.8,0.2,1);
  --transition-slow: 400ms cubic-bezier(0.2,0.8,0.2,1);
}

/* RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background var(--transition-slow),color var(--transition)}
img,video,canvas{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:0;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--yellow);color:var(--ink)}
*:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ============================================================
   GLASS MORPHISM SYSTEM
   ============================================================ */
.glass{
  background:var(--gradient-glass);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--glass-border);
  box-shadow:0 8px 32px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
}
.glass-strong{
  background:rgba(18,18,24,0.85);
  backdrop-filter:blur(30px) saturate(1.6);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid rgba(255,255,255,0.1);
}

/* NOISE OVERLAY */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;
  background-image:var(--noise);background-repeat:repeat;background-size:256px;
  opacity:0.4;mix-blend-mode:overlay;
}

/* ============================================================
   ANIMATED GRADIENT BORDER
   ============================================================ */
@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes borderRotate { to { --angle: 360deg; } }
.glow-border{
  position:relative;
  background:var(--bg-solid);
  border-radius:var(--radius-lg);
}
.glow-border::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:conic-gradient(from var(--angle), var(--yellow), var(--amber), #FF5722, var(--royal), var(--navy), var(--royal), #FF5722, var(--yellow));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderRotate 4s linear infinite;
  opacity:0;transition:opacity .4s ease;
}
.glow-border:hover::before{opacity:0.8}

/* ============================================================
   GRADIENT TEXT
   ============================================================ */
.gradient-text{
  background:var(--gradient-brand-text);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ============================================================
   UTILITIES
   ============================================================ */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;font-weight:500;color:var(--yellow)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.3rem;font-family:var(--body);font-weight:700;font-size:.9rem;border-radius:var(--radius);transition:all var(--transition);white-space:nowrap;border:1px solid transparent;position:relative;overflow:hidden}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-lg svg{width:18px;height:18px}
.btn-sm svg{width:12px;height:12px}
.btn-primary{background:var(--gradient-warm);color:var(--ink);border:none;box-shadow:var(--glow-sm)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--glow-xl);filter:brightness(1.1)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border-strong);backdrop-filter:blur(10px)}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow);box-shadow:var(--glow-sm)}
.btn-lg{padding:1.1rem 2rem;font-size:1rem;border-radius:var(--radius-lg)}
.btn-sm{padding:.55rem .9rem;font-size:.8rem}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.9}

/* FLOATING ORB ANIMATIONS */
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
@keyframes pulse-glow{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.2)}}
@keyframes breathe{0%,100%{box-shadow:0 0 20px rgba(255,214,10,0.15)}50%{box-shadow:0 0 40px rgba(255,214,10,0.35)}}

/* ANNOUNCE BAR */
.announce{background:var(--gradient-warm);color:var(--ink);text-align:center;padding:.55rem var(--pad);font-size:.78rem;font-family:var(--mono);font-weight:600;letter-spacing:.08em;text-transform:uppercase;z-index:60;position:relative}
.announce::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent)}

/* NAV */
nav.landing-nav{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
nav.landing-nav .glass-nav{background:rgba(5,5,8,0.6);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
[data-theme="light"] nav.landing-nav .glass-nav{background:rgba(250,250,245,0.7)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:1rem var(--pad);max-width:var(--max);margin:0 auto;gap:1.5rem}
.logo{display:flex;align-items:center;gap:.65rem;font-family:var(--display);font-weight:800;font-size:1.1rem}
.logo-mark{width:34px;height:34px;background:var(--gradient-warm);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1rem;border-radius:var(--radius);flex-shrink:0;box-shadow:var(--glow-sm);animation:breathe 3s ease-in-out infinite}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-text .pri{font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:.95rem}
.logo-text .sec{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);letter-spacing:.2em;margin-top:2px}
.nav-links{display:flex;gap:1.75rem;font-size:.88rem;font-weight:500}
.nav-links a{color:var(--text-muted);transition:color var(--transition);position:relative}
.nav-links a:hover{color:var(--yellow)}
.nav-links a:hover::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:var(--gradient-warm);border-radius:1px}
@media(max-width:820px){.nav-links{display:none}}
.nav-controls{display:flex;align-items:center;gap:.5rem}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius);border:1px solid var(--border);color:var(--text-muted);transition:all var(--transition)}
.icon-btn:hover{border-color:var(--yellow);color:var(--yellow);box-shadow:var(--glow-sm)}
.icon-btn svg{width:16px;height:16px}

/* ============================================================
   HERO — SUPERNOVA EDITION
   ============================================================ */
.hero{position:relative;padding:clamp(4rem,10vw,8rem) var(--pad) clamp(5rem,10vw,8rem);overflow:hidden}
/* Animated gradient orbs */
.hero-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:float 8s ease-in-out infinite}
.hero-orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(255,214,10,0.25),transparent 70%);top:-10%;right:-5%;animation-delay:0s}
.hero-orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,140,0,0.2),transparent 70%);bottom:-20%;left:-10%;animation-delay:2s}
.hero-orb-3{width:400px;height:400px;background:radial-gradient(circle,rgba(65,105,225,0.18),transparent 70%);top:30%;left:40%;animation-delay:4s}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black,transparent);pointer-events:none}
.hero::after{content:'EMPIRE';position:absolute;right:-.05em;bottom:-.12em;font-family:var(--display);font-weight:900;font-size:clamp(10rem,26vw,26rem);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,214,10,0.08);pointer-events:none;user-select:none;letter-spacing:-.04em}
.hero-inner{position:relative;z-index:2;max-width:var(--max);margin:0 auto}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1.1rem;background:rgba(255,214,10,0.08);border:1px solid rgba(255,214,10,0.2);border-radius:999px;font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--yellow);margin-bottom:2rem;animation:fadeUp .6s ease both;backdrop-filter:blur(10px)}
.pulse-dot{width:6px;height:6px;background:var(--yellow);border-radius:50%;animation:pulse 2s infinite;box-shadow:0 0 10px var(--yellow)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,.6)}50%{box-shadow:0 0 0 8px rgba(255,214,10,0)}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,7.5rem);line-height:.88;letter-spacing:-.045em;margin-bottom:1.5rem;max-width:16ch;animation:fadeUp .7s ease .1s both}
.hero h1 .yellow{background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(1.05rem,1.5vw,1.3rem);color:var(--text-muted);max-width:58ch;margin-bottom:2.5rem;line-height:1.6;animation:fadeUp .7s ease .25s both}
.hero-sub strong{color:var(--text);font-weight:700}
.hero-ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:3.5rem;animation:fadeUp .7s ease .4s both}
.hero-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;max-width:760px;padding-top:2rem;border-top:1px solid var(--border);animation:fadeUp .7s ease .55s both}
.meta-item{padding:.75rem;border-radius:var(--radius);background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);transition:all var(--transition)}
.meta-item:hover{border-color:rgba(255,214,10,0.3);box-shadow:var(--glow-sm)}
.meta-item .num{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.meta-item .label{font-family:var(--mono);font-size:.7rem;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase;margin-top:.3rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* MARQUEE */
.marquee{background:var(--gradient-warm);color:var(--ink);overflow:hidden;white-space:nowrap;padding:1.2rem 0;position:relative}
.marquee::before,.marquee::after{content:'';position:absolute;top:0;bottom:0;width:1px;z-index:1}
.marquee::before{left:0;background:rgba(0,0,0,0.2)}
.marquee::after{right:0;background:rgba(0,0,0,0.2)}
.marquee-track{display:inline-block;animation:scroll 28s linear infinite;font-family:var(--display);font-weight:900;font-size:1.75rem;letter-spacing:.02em}
.marquee-track span{margin:0 2rem}
.marquee-track .sep{opacity:.3}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* SECTIONS */
section.sec{padding:clamp(4rem,8vw,7rem) var(--pad);position:relative}
.sec-head{max-width:760px;margin-bottom:clamp(2.5rem,5vw,4rem)}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.75rem);line-height:1;letter-spacing:-.03em;margin-top:1.25rem}
.sec-head h2 .yellow{background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sec-head p{font-size:1.05rem;color:var(--text-muted);margin-top:1.25rem;max-width:60ch}

/* FEATURES — GLASS CARDS */
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;max-width:var(--max);margin:0 auto}
.feature-card{padding:2rem 1.75rem;border-radius:var(--radius-xl);position:relative;overflow:hidden;transition:all var(--transition-slow);background:var(--gradient-glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border)}
.feature-card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--gradient-brand);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.feature-card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,214,10,0.06),transparent 60%);opacity:0;transition:opacity .4s}
.feature-card:hover{transform:translateY(-6px);border-color:rgba(255,214,10,0.2);box-shadow:var(--glow-md)}
.feature-card:hover::before{transform:scaleX(1)}
.feature-card:hover::after{opacity:1}
.feature-card .idx{font-family:var(--mono);font-size:.75rem;color:var(--text-dim);margin-bottom:1.25rem;letter-spacing:.1em}
.feature-card .icon-box{width:48px;height:48px;background:rgba(255,214,10,0.1);color:var(--yellow);border-radius:var(--radius-lg);display:grid;place-items:center;margin-bottom:1.25rem;box-shadow:0 0 20px rgba(255,214,10,0.1)}
.feature-card .icon-box svg{width:22px;height:22px}
.feature-card h3{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:-.015em;margin-bottom:.5rem}
.feature-card p{color:var(--text-muted);font-size:.95rem;line-height:1.55}

/* HOW IT WORKS */
.how{background:var(--bg-solid);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:relative}
.how::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 50% 80% at 50% 0%,rgba(255,214,10,0.05),transparent);pointer-events:none}
.how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;max-width:var(--max);margin:0 auto}
@media(max-width:820px){.how-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.how-grid{grid-template-columns:1fr}}
.how-step{position:relative}
.how-step .step-num{font-family:var(--display);font-weight:900;font-size:4.5rem;line-height:.8;background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
.how-step h3{font-family:var(--display);font-weight:700;font-size:1.2rem;margin-bottom:.5rem;letter-spacing:-.02em}
.how-step p{color:var(--text-muted);font-size:.9rem}

/* FAQ */
details.faq-item{border-radius:var(--radius-lg);margin-bottom:.5rem;overflow:hidden;transition:all var(--transition);background:var(--gradient-glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border)}
details.faq-item[open]{border-color:rgba(255,214,10,0.3);box-shadow:var(--glow-sm)}
details.faq-item summary{padding:1.15rem 1.5rem;font-weight:600;font-size:1rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.faq-item summary::-webkit-details-marker{display:none}
details.faq-item summary::after{content:'+';font-family:var(--display);color:var(--yellow);font-size:1.6rem;line-height:1;transition:transform var(--transition)}
details.faq-item[open] summary::after{transform:rotate(45deg)}
.faq-answer{padding:0 1.5rem 1.35rem;color:var(--text-muted);font-size:.95rem;line-height:1.65}

/* FINAL CTA */
.final-cta{background:var(--gradient-warm);color:var(--ink);text-align:center;padding:clamp(5rem,10vw,8rem) var(--pad);position:relative;overflow:hidden}
.final-cta::before{content:'EMPIRE';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:clamp(14rem,28vw,26rem);line-height:1;color:rgba(0,0,0,.06);pointer-events:none;user-select:none;white-space:nowrap;letter-spacing:-.04em}
.final-cta>*{position:relative;z-index:1}
.final-cta h2{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,7vw,5rem);line-height:.92;letter-spacing:-.03em;margin-bottom:1.25rem}
.final-cta p{font-size:1.1rem;max-width:50ch;margin:0 auto 2.5rem;font-weight:500}
.final-cta .btn{background:var(--ink);color:var(--yellow);border:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.final-cta .btn:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(0,0,0,.4)}

/* FOOTER */
footer{background:var(--bg);padding:3rem var(--pad) 2rem;border-top:1px solid var(--border)}
.footer-inner{max-width:var(--max);margin:0 auto}
.footer-top{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:2rem;padding-bottom:2.5rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
@media(max-width:820px){.footer-top{grid-template-columns:1fr 1fr}}
.footer-col h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:1rem}
.footer-col a{display:block;color:var(--text-muted);font-size:.88rem;margin-bottom:.5rem;transition:color var(--transition)}
.footer-col a:hover{color:var(--yellow)}
.footer-about{font-size:.88rem;color:var(--text-muted);line-height:1.6}
.footer-about .logo{margin-bottom:1rem}
.copy{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-family:var(--mono);font-size:.75rem;color:var(--text-dim)}

/* ============================================================
   APP SHELL — GLASS EDITION
   ============================================================ */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}

.sidebar{background:var(--bg-solid);border-right:1px solid var(--border);padding:1.25rem .75rem;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-header{padding:.5rem .75rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.nav-group{margin-bottom:1rem}
.nav-group-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);padding:.5rem .75rem;margin-bottom:.25rem}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;width:100%;text-align:left;border-radius:var(--radius-lg);font-size:.88rem;font-weight:500;color:var(--text-muted);transition:all var(--transition);margin-bottom:2px;position:relative}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:var(--gradient-warm);color:var(--ink);box-shadow:var(--glow-sm)}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:.62rem;padding:.15rem .45rem;background:var(--gradient-accent);border-radius:var(--radius);color:#fff;border:none;box-shadow:0 0 8px var(--royal-glow)}
.nav-item.active .badge{background:rgba(0,0,0,.15);color:var(--ink);border-color:transparent}
.sidebar-footer{margin-top:auto;padding:.75rem;border-top:1px solid var(--border);padding-top:1rem}
.user-chip{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:var(--radius-lg);cursor:pointer;transition:background var(--transition)}
.user-chip:hover{background:var(--glass)}
.avatar{width:34px;height:34px;background:var(--gradient-warm);color:var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.85rem;flex-shrink:0;box-shadow:var(--glow-sm)}
.user-chip .name{font-size:.82rem;font-weight:600;line-height:1.2}
.user-chip .plan{font-family:var(--mono);font-size:.65rem;color:var(--yellow);letter-spacing:.1em}

/* TOPBAR */
.topbar{height:60px;border-bottom:1px solid var(--border);background:rgba(5,5,8,0.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:0 var(--pad);display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:20}
[data-theme="light"] .topbar{background:rgba(250,250,245,0.6)}
.crumb{font-family:var(--mono);font-size:.8rem;color:var(--text-muted);letter-spacing:.05em}
.crumb .sep{margin:0 .5rem;color:var(--text-dim)}
.crumb .active{background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:.5rem}

/* MAIN */
.main{padding:clamp(1.5rem,3vw,2.5rem);max-width:1400px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;margin-bottom:2rem}
.view-head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.75rem,4vw,2.75rem);letter-spacing:-.03em;line-height:1;margin-bottom:.4rem;background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.view-head .sub{color:var(--text-muted);font-size:.95rem}

/* STAT CARDS — GLASS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{border-radius:var(--radius-xl);padding:1.25rem 1.5rem;position:relative;overflow:hidden;background:var(--gradient-glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);transition:all var(--transition)}
.stat-card:hover{border-color:rgba(255,214,10,0.2);box-shadow:var(--glow-sm);transform:translateY(-2px)}
.stat-card .label{font-family:var(--mono);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);margin-bottom:.5rem}
.stat-card .value{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.03em;margin-bottom:.3rem;background:var(--gradient-brand-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .delta{font-family:var(--mono);font-size:.75rem;color:var(--green)}
.stat-card .delta.down{color:var(--red)}
.stat-card .bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--gradient-warm);border-radius:0 0 var(--radius-xl) var(--radius-xl)}

/* CARD — GLASS */
.card{border-radius:var(--radius-xl);padding:1.5rem;background:var(--gradient-glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);transition:all var(--transition)}
.card:hover{border-color:rgba(255,255,255,0.12)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.card-head h3{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.02em}

/* FORM INPUTS — GLASS */
.input,.select-input,.textarea{width:100%;padding:.75rem .9rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--text);font-size:.9rem;transition:all var(--transition);backdrop-filter:blur(8px)}
.input:focus,.select-input:focus,.textarea:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-glow),var(--glow-sm)}
.textarea{resize:vertical;min-height:90px;font-family:var(--body)}
label.field{display:block;margin-bottom:1.15rem}
label.field .lbl{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.35rem;font-weight:600}
label.field .req{color:var(--yellow)}

/* STRATEGY OUTPUT */
.strategy-output{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;font-family:var(--mono);font-size:.82rem;line-height:1.7;max-height:640px;overflow-y:auto;white-space:pre-wrap;color:var(--text);backdrop-filter:blur(8px)}

/* TIMELINE — GLASS */
.timeline{border-radius:var(--radius-xl);padding:1rem;background:var(--gradient-glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border)}
.track{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;min-height:36px}
.track-label{width:68px;font-family:var(--mono);font-size:.7rem;color:var(--text-muted);letter-spacing:.1em;flex-shrink:0}
.track-lane{flex:1;height:36px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.clip{position:absolute;top:3px;bottom:3px;border-radius:var(--radius);font-family:var(--mono);font-size:.65rem;color:var(--ink);display:flex;align-items:center;padding:0 8px;font-weight:700;cursor:grab;transition:all .15s}
.clip.video{background:var(--gradient-warm)}
.clip.audio{background:linear-gradient(135deg,#4EA8FF,#8B5CF6);color:#fff}
.clip.caption{background:linear-gradient(135deg,#FF2D87,#8B5CF6);color:#fff}
.clip.broll{background:var(--amber)}

/* LANGUAGE CHIPS */
.lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.5rem}
.lang-chip{padding:.9rem 1rem;border-radius:var(--radius-lg);display:flex;align-items:center;gap:.75rem;cursor:pointer;transition:all var(--transition);background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(8px)}
.lang-chip:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.lang-chip.active{border-color:var(--yellow);background:rgba(255,214,10,0.08);box-shadow:var(--glow-sm)}
.lang-chip .flag{font-size:1.25rem;line-height:1}
.lang-chip .nm{font-weight:600;font-size:.88rem}
.lang-chip .native{font-size:.75rem;color:var(--text-muted)}

/* CALENDAR */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;margin-bottom:.5rem}
.cal-head div{font-family:var(--mono);font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;text-align:center;padding:.35rem 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.cal-cell{aspect-ratio:1/1.1;border-radius:var(--radius-lg);padding:.5rem;position:relative;overflow:hidden;transition:all var(--transition);cursor:pointer;background:var(--glass);border:1px solid var(--glass-border)}
.cal-cell:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.cal-cell.has-post{border-color:rgba(255,214,10,0.3);background:rgba(255,214,10,0.05);box-shadow:var(--glow-sm)}
.cal-cell.today{outline:2px solid var(--yellow);outline-offset:-2px;box-shadow:var(--glow-sm)}
.cal-cell .date{font-family:var(--mono);font-size:.7rem;color:var(--text-muted);font-weight:600}
.cal-cell .event{position:absolute;left:.3rem;right:.3rem;bottom:.3rem;padding:3px 5px;background:var(--gradient-warm);color:var(--ink);font-family:var(--mono);font-size:.62rem;font-weight:700;border-radius:var(--radius);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* EDITOR STAGE */
.editor-stage{background:#000;border:1px solid var(--border);border-radius:var(--radius-xl);aspect-ratio:16/9;max-height:420px;display:grid;place-items:center;color:var(--text-dim);margin-bottom:1rem;position:relative;overflow:hidden}
.editor-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,214,10,0.03),transparent 60%)}

/* TELEPROMPTER */
.teleprompter-overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}
.teleprompter-text{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 15%;text-align:center}
.teleprompter-line{font-family:var(--body);color:#fff;transition:all .3s;line-height:1.5}
.teleprompter-line.active{opacity:1;font-size:1.4em;text-shadow:0 0 20px rgba(255,214,10,0.5)}
.teleprompter-line.dim{opacity:.3;font-size:1em}
.teleprompter-line.beat{color:var(--yellow);font-family:var(--mono);font-size:.8em;letter-spacing:.15em;text-transform:uppercase;margin:.5rem 0}
.teleprompter-controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;pointer-events:auto;padding:.5rem .75rem;background:rgba(0,0,0,.7);border-radius:999px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
.teleprompter-controls button{color:#fff;font-family:var(--mono);font-size:.7rem;padding:.3rem .6rem;border-radius:var(--radius);transition:all .15s}
.teleprompter-controls button:hover{background:rgba(255,214,10,.2);color:var(--yellow)}
.teleprompter-controls button.active{background:var(--yellow);color:var(--ink)}

/* DUAL CAMERA */
.dual-camera{display:grid;height:100%;width:100%;position:relative}
.dual-camera.side-by-side{grid-template-columns:1fr 1fr;gap:2px}
.dual-camera.pip{grid-template-columns:1fr}
.camera-feed{display:grid;place-items:center;position:relative;overflow:hidden}
.camera-feed.selfie{background:linear-gradient(135deg,#0A0A12,#1A1A28)}
.camera-feed.outward{background:linear-gradient(135deg,#0A120A,#1A281A)}
.camera-label{position:absolute;top:8px;left:8px;padding:.25rem .5rem;background:rgba(0,0,0,.6);border-radius:var(--radius);font-family:var(--mono);font-size:.65rem;color:#fff;backdrop-filter:blur(4px);display:flex;align-items:center;gap:.35rem;z-index:2}
.camera-label .dot{width:6px;height:6px;border-radius:50%}
.pip-bubble{position:absolute;bottom:12px;right:12px;width:140px;height:180px;border-radius:var(--radius-xl);overflow:hidden;border:2px solid var(--yellow);box-shadow:var(--glow-md);z-index:3;display:grid;place-items:center;background:linear-gradient(135deg,#0A0A12,#1A1A28)}

/* NEURAL IMPACT VISUALIZER */
.brain-viz{position:relative;width:100%;max-width:400px;margin:0 auto}
.brain-svg{width:100%;height:auto}
.brain-region{transition:all .5s ease;cursor:pointer}
.brain-region:hover{filter:brightness(1.3)}
.brain-legend{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1rem}
.brain-legend-item{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.7rem;color:var(--text-muted)}
.brain-legend-dot{width:10px;height:10px;border-radius:50%}

/* EMAIL PREVIEW */
.email-preview{background:#fff;border-radius:var(--radius-lg);overflow:hidden;color:#333;font-family:Arial,sans-serif;max-width:600px;margin:0 auto}
.email-header{padding:1.5rem;background:#f8f8f8;border-bottom:1px solid #eee}
.email-body{padding:1.5rem}
.email-video-embed{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;margin:1rem 0;position:relative;cursor:pointer}
.email-video-embed .play-overlay{width:64px;height:64px;background:var(--gradient-warm);border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}

/* SOCIAL PREVIEW CARDS */
.social-preview{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);background:var(--glass)}
.social-preview-header{padding:.75rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border)}
.social-preview-body{padding:1rem}
.social-preview-media{background:#111;aspect-ratio:9/16;border-radius:var(--radius);display:grid;place-items:center;margin-bottom:.75rem;max-height:200px;overflow:hidden}

/* CONTENT SCORE */
.score-ring{position:relative;width:120px;height:120px;display:inline-block}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .track-bg{fill:none;stroke:var(--border);stroke-width:8}
.score-ring .track-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease,stroke .5s}
.score-value{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2rem}

/* COMMAND PALETTE */
.cmd-palette-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:200;display:grid;place-items:start center;padding-top:20vh}
.cmd-palette{width:min(560px,90vw);background:var(--bg-solid);border:1px solid var(--border-strong);border-radius:var(--radius-xl);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),var(--glow-md);animation:fadeUp .2s ease}
.cmd-input{width:100%;padding:1rem 1.25rem;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:1rem;font-family:var(--body)}
.cmd-input:focus{outline:none}
.cmd-results{max-height:320px;overflow-y:auto;padding:.5rem}
.cmd-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:var(--radius);cursor:pointer;transition:all .1s;font-size:.9rem}
.cmd-item:hover,.cmd-item.active{background:rgba(255,214,10,0.08);color:var(--yellow)}
.cmd-item svg{width:16px;height:16px;opacity:.6}
.cmd-item .shortcut{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--text-dim);padding:.15rem .4rem;background:var(--glass);border:1px solid var(--border);border-radius:3px}

/* TOAST */
.toast-container{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.85rem 1.2rem;border-radius:var(--radius-lg);font-size:.88rem;display:flex;align-items:center;gap:.75rem;animation:slideIn .3s ease;min-width:280px;background:var(--bg-solid);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.3),var(--glow-sm)}
.toast.success{border-color:rgba(0,230,138,0.3)}
.toast.error{border-color:rgba(255,59,92,0.3)}
.toast.info{border-color:rgba(255,214,10,0.3)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ASSET DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s ease}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.asset-drawer{position:fixed;top:0;right:0;width:min(460px,100vw);height:100vh;background:var(--bg-solid);border-left:1px solid var(--border);z-index:95;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 80px rgba(0,0,0,.4)}
.asset-drawer.open{transform:translateX(0)}
.drawer-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-family:var(--display);font-size:1.15rem}
.drawer-tabs{display:flex;padding:0 1.25rem;border-bottom:1px solid var(--border)}
.drawer-tab{padding:.85rem 1rem;font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.drawer-tab:hover{color:var(--text)}
.drawer-tab.active{color:var(--yellow);border-bottom-color:var(--yellow)}
.drawer-body{flex:1;overflow-y:auto;padding:1.25rem}

/* MUSIC */
.music-track{display:grid;grid-template-columns:44px 1fr auto;gap:.85rem;align-items:center;padding:.75rem;border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.5rem;background:var(--glass);transition:all .15s;backdrop-filter:blur(8px)}
.music-track:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.music-play-btn{width:44px;height:44px;background:transparent;color:var(--yellow);border:1px solid var(--yellow);border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.music-play-btn:hover{background:var(--yellow);color:var(--ink);box-shadow:var(--glow-sm)}
.music-meta .title{font-weight:600;font-size:.92rem;margin-bottom:2px}
.music-meta .sub{font-family:var(--mono);font-size:.68rem;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}
.mood-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
.mood-chip{padding:.35rem .75rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--glass);border:1px solid var(--border);color:var(--text-muted);border-radius:999px;cursor:pointer;transition:all .15s}
.mood-chip:hover{color:var(--text);border-color:var(--text-muted)}
.mood-chip.active{background:var(--gradient-warm);color:var(--ink);border-color:transparent;font-weight:700}

/* WAVEFORM */
.waveform{display:flex;align-items:center;gap:1px;height:100%;padding:0 4px}
.waveform-bar{background:var(--blue);border-radius:1px;transition:height .1s;min-width:2px}

/* SPINNER */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE */
@media(max-width:900px){
  .sidebar{position:fixed;top:0;left:0;width:85%;max-width:300px;z-index:100;box-shadow:0 0 60px rgba(0,0,0,.5);transform:translateX(-100%);transition:transform .3s ease}
  .sidebar.open{transform:translateX(0)}
}

/* VIEW TRANSITIONS */
.view-enter{animation:fadeUp .3s ease both}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{padding:.75rem 1.25rem;font-weight:600;font-size:.88rem;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--yellow);border-bottom-color:var(--yellow)}

/* GATES */

const AppContext = createContext();

function AppProvider({children}) {
  const [theme, setTheme] = useState(() => localStorage.getItem('eos-theme') || 'dark');
  const [lang, setLang] = useState(() => localStorage.getItem('eos-lang') || 'en');
  const [view, setView] = useState('landing');
  const [toasts, setToasts] = useState([]);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [drawerTab, setDrawerTab] = useState('music');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [latestStrategy, setLatestStrategy] = useState(null);
  const [vaultOpen, setVaultOpen] = useState(false);
  const [vaultLoadHandler, setVaultLoadHandler] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('eos-theme', theme);
  }, [theme]);
  useEffect(() => { localStorage.setItem('eos-lang', lang); }, [lang]);

  // Cmd+K listener
  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setCmdOpen(p => !p); }
      if (e.key === 'Escape') setCmdOpen(false);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const t = useCallback((key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key, [lang]);
  const addToast = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(prev => [...prev, {id, msg, type}]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
  }, []);
  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);

  const value = useMemo(() => ({
    theme, toggleTheme, lang, setLang, t, view, setView, toasts, addToast,
    drawerOpen, setDrawerOpen, drawerTab, setDrawerTab, sidebarOpen, setSidebarOpen,
    cmdOpen, setCmdOpen, latestStrategy, setLatestStrategy, vaultOpen, setVaultOpen,
    vaultLoadHandler, setVaultLoadHandler
  }), [theme, lang, t, view, toasts, drawerOpen, drawerTab, sidebarOpen, cmdOpen, latestStrategy, vaultOpen, vaultLoadHandler, addToast, toggleTheme]);

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}
function useApp() { return useContext(AppContext); }

/* ============================================================
   SUPABASE CLIENT (auto-activates with credentials in Settings)
   ============================================================ */
const SupabaseClient = (() => {
  let client = null;
  let workspaceId = localStorage.getItem('eos-workspace-id') || null;
  return {
    init(url, anonKey) {
      if (!url || !anonKey || !window.supabase) return false;
      try { client = window.supabase.createClient(url, anonKey); localStorage.setItem('eos-sb-url', url); localStorage.setItem('eos-sb-key', anonKey); return true; } catch(e) { console.error('Supabase init:', e); return false; }
    },
    isReady() { return !!client; },
    getClient() { return client; },
    getWorkspaceId() { return workspaceId; },
    setWorkspaceId(id) { workspaceId = id; if (id) localStorage.setItem('eos-workspace-id', id); else localStorage.removeItem('eos-workspace-id'); },
    async fetch(table, opts={}) {
      if (!client) return null;
      let q = client.from(table).select(opts.select || '*');
      if (opts.eq) Object.entries(opts.eq).forEach(([k,v]) => q = q.eq(k,v));
      if (opts.in) Object.entries(opts.in).forEach(([k,v]) => q = q.in(k,v));
      if (opts.order) q = q.order(opts.order, {ascending: opts.ascending !== false});
      if (opts.limit) q = q.limit(opts.limit);
      const {data, error} = await q;
      if (error) { console.warn('Supabase fetch ['+table+']:', error.message); return null; }
      return data;
    },
    async insert(table, row) {
      if (!client) return null;
      const {data, error} = await client.from(table).insert(row).select();
      if (error) { console.warn('Supabase insert ['+table+']:', error.message); return null; }
      return data;
    },
    async update(table, id, patch) {
      if (!client) return null;
      const {data, error} = await client.from(table).update(patch).eq('id', id).select();
      if (error) { console.warn('Supabase update ['+table+']:', error.message); return null; }
      return data;
    },
    async delete(table, id) {
      if (!client) return false;
      const {error} = await client.from(table).delete().eq('id', id);
      if (error) { console.warn('Supabase delete ['+table+']:', error.message); return false; }
      return true;
    },
    async upsert(table, row, onConflict) {
      if (!client) return null;
      const {data, error} = await client.from(table).upsert(row, onConflict ? {onConflict} : undefined).select();
      if (error) { console.warn('Supabase upsert ['+table+']:', error.message); return null; }
      return data;
    },
    async signIn(email, password) { if (!client) return null; return await client.auth.signInWithPassword({email, password}); },
    async signUp(email, password) { if (!client) return null; return await client.auth.signUp({email, password}); },
    async signOut() { if (client) await client.auth.signOut(); },
    async getUser() { if (!client) return null; const {data} = await client.auth.getUser(); return data?.user || null; },
  };
})();

// Expose globally for React components and dev console
if (typeof window !== 'undefined') {
  window.SupabaseClient = SupabaseClient;
  const savedUrl = localStorage.getItem('eos-sb-url');
  const savedKey = localStorage.getItem('eos-sb-key');
  if (savedUrl && savedKey) SupabaseClient.init(savedUrl, savedKey);
}

/* ============================================================
   AI CONTENT SCORE
   ============================================================ */
function ContentScore({score}) {
  const circumference = 2 * Math.PI * 52;
  const offset = circumference - (score / 100) * circumference;
  const color = score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--yellow)' : score >= 40 ? 'var(--amber)' : 'var(--red)';

  return (
    <div className="score-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle className="track-bg" cx="60" cy="60" r="52"/>
        <circle className="track-fill" cx="60" cy="60" r="52" stroke={color} strokeDasharray={circumference} strokeDashoffset={offset} style={{filter:`drop-shadow(0 0 8px ${color})`}}/>
      </svg>
      <div className="score-value" style={{color}}>{score}</div>
    </div>
  );
}

/* ============================================================
   SVG CHART
   ============================================================ */
function SVGChart({data, dataKey, color, height = 280}) {
  const [hover, setHover] = useState(null);
  const vals = data.map(d => d[dataKey]);
  const max = Math.max(...vals) * 1.1;
  const w = 800, h = height, padL = 55, padR = 10, padT = 15, padB = 35;
  const chartW = w - padL - padR, chartH = h - padT - padB;

  const points = vals.map((v, i) => ({
    x: padL + (i / (vals.length - 1)) * chartW,
    y: padT + chartH - ((v / max)) * chartH,
    val: v, label: data[i].day
  }));

  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaD = pathD + ` L ${points[points.length-1].x} ${padT+chartH} L ${points[0].x} ${padT+chartH} Z`;

  const gridLines = 5;
  const yLabels = Array.from({length: gridLines + 1}, (_, i) => ({
    val: (max / gridLines) * i,
    y: padT + chartH - (i / gridLines) * chartH
  }));

  return (
    <div style={{height, position:'relative'}}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:'100%'}} onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id={`grad-${dataKey}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {yLabels.map((yl, i) => (
          <React.Fragment key={i}>
            <line x1={padL} y1={yl.y} x2={w - padR} y2={yl.y} stroke="var(--border)" strokeDasharray="3 3"/>
            <text x={padL - 8} y={yl.y + 4} textAnchor="end" fill="var(--text-dim)" fontSize="10" fontFamily="var(--mono)">
              {dataKey === 'engagement' ? yl.val.toFixed(1) + '%' : yl.val >= 1000 ? (yl.val/1000).toFixed(1)+'K' : Math.round(yl.val)}
            </text>
          </React.Fragment>
        ))}
        {points.filter((_, i) => i % 5 === 0).map((p, i) => (
          <text key={i} x={p.x} y={h - 5} textAnchor="middle" fill="var(--text-dim)" fontSize="9" fontFamily="var(--mono)">{p.label}</text>
        ))}
        <path d={areaD} fill={`url(#grad-${dataKey})`}/>
        <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{filter:`drop-shadow(0 0 6px ${color})`}}/>
        {points.map((p, i) => (
          <rect key={i} x={p.x - chartW/vals.length/2} y={padT} width={chartW/vals.length} height={chartH} fill="transparent" onMouseEnter={() => setHover(i)} style={{cursor:'crosshair'}}/>
        ))}
        {hover !== null && (
          <>
            <line x1={points[hover].x} y1={padT} x2={points[hover].x} y2={padT+chartH} stroke={color} strokeDasharray="3 3" opacity="0.5"/>
            <circle cx={points[hover].x} cy={points[hover].y} r="6" fill={color} stroke="var(--bg)" strokeWidth="2" style={{filter:`drop-shadow(0 0 8px ${color})`}}/>
          </>
        )}
      </svg>
      {hover !== null && (
        <div style={{position:'absolute',left:Math.min((points[hover].x/w)*100, 85)+'%',top:Math.max(points[hover].y/h*100 - 15, 5)+'%',background:'var(--bg-solid)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'.5rem .8rem',fontFamily:'var(--mono)',fontSize:'.78rem',pointerEvents:'none',zIndex:5,whiteSpace:'nowrap',backdropFilter:'blur(12px)',boxShadow:'var(--glow-sm)'}}>
          <div style={{color:'var(--text-dim)',fontSize:'.68rem'}}>{points[hover].label}</div>
          <div style={{color,fontWeight:700}}>{dataKey === 'engagement' ? points[hover].val.toFixed(1)+'%' : points[hover].val.toLocaleString()}</div>
        </div>
      )}
    </div>
  );
}

  const [scoringInProgress, setScoringInProgress] = useState(false);
  const [emailModalOpen, setEmailModalOpen] = useState(false);
  const [collaboratorsForEmail, setCollaboratorsForEmail] = useState([]);
  const [selectedCollabs, setSelectedCollabs] = useState([]);
  const [sendingEmail, setSendingEmail] = useState(false);
  const outputRef = useRef(null);
  const [selectedOutputs, setSelectedOutputs] = useState(new Set(ALL_OUTPUTS.map(o=>o.id)));
  const [presetMode, setPresetMode] = useState('default');
  const [customPresets, setCustomPresets] = useState([QUICK_SHORT_PRESET, CAROUSEL_PRESET, YOUTUBE_PRESET]);
  const [showOutputs, setShowOutputs] = useState(false);

  const toggleOutput = (id) => setSelectedOutputs(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const applyPreset = (preset) => {
    setSelectedOutputs(new Set(preset.outputs));
    addToast(`Preset "${preset.name}" applied — ${preset.outputs.length} outputs selected`, 'success');
  };

  const saveCustomPreset = () => {
    if (customPresets.length >= 5) { addToast('Max 5 custom presets', 'error'); return; }
    const name = `Custom ${customPresets.length + 1}`;
    setCustomPresets(prev => [...prev, {name, outputs: [...selectedOutputs]}]);
    addToast(`Preset "${name}" saved!`, 'success');
  };

  const gates = useMemo(() => {
    if (!topic) return [{label:'DEMAND',status:'pending'},{label:'FIT',status:'pending'},{label:'INTEREST',status:'pending'}];
    const len = topic.length;
    return [
      {label:'DEMAND',status: len > 5 ? 'pass' : 'pending'},
      {label:'FIT',status: len > 15 ? 'pass' : 'pending'},
      {label:'INTEREST',status: len > 25 ? 'pass' : 'pending'},
    ];
  }, [topic]);

  const allPass = gates.every(g => g.status === 'pass');
  const aiScore = useMemo(() => topic.length > 25 ? Math.min(99, 40 + Math.floor(topic.length * 1.2)) : topic.length > 10 ? 30 + topic.length : 0, [topic]);

  const handleGenerate = () => {
    if (!allPass) return;
    setGenerating(true); setOutput(''); setApproved(false);
    let i = 0;
    const text = MOCK_STRATEGY_OUTPUT;
    const interval = setInterval(() => {
      i += 3;
      setOutput(text.slice(0, i));
      if (outputRef.current) outputRef.current.scrollTop = outputRef.current.scrollHeight;
      if (i >= text.length) {
        clearInterval(interval);
        setGenerating(false);
        // Auto-save to Strategy Vault then auto-score
        saveToVault(text).then(savedId => {
          setTimeout(() => runBrainScore(savedId), 400);
        });
      }
    }, 8);
  };

  const saveToVault = async (outputText) => {
    const sb = window.SupabaseClient;
    const strategyData = {
      type: 'strategy',
      title: topic,
      brief: {topic, output: outputText, contentType, generatedAt: new Date().toISOString()},
      status: 'approved',
      platforms: ['ig','tt','yt','li'],
    };
    if (sb && sb.isReady()) {
      const wsId = sb.getWorkspaceId();
      if (wsId) strategyData.workspace_id = wsId;
      const result = await sb.insert('content', strategyData);
      if (result && result[0]) {
        setSavedStrategyId(result[0].id);
        setLatestStrategy({...result[0], topic, output: outputText, contentType});
        addToast('Saved to Strategy Vault','success');
        return result[0].id;
      }
    }
    // Local fallback
    const localId = 'local-'+Date.now();
    const localStrat = {id: localId, title: topic, brief: strategyData.brief, created_at: new Date().toISOString(), topic, output: outputText, contentType};
    try {
      const cached = JSON.parse(localStorage.getItem('eos-strategies-local') || '[]');
      cached.unshift(localStrat);
      localStorage.setItem('eos-strategies-local', JSON.stringify(cached.slice(0,50)));
    } catch(e) {}
    setSavedStrategyId(localId);
    setLatestStrategy(localStrat);
    addToast('Saved locally (connect Supabase for sync)','info');
    return localId;
  };

  const sendToTeleprompter = () => {

  const runBrainScore = async (contentIdOverride = null) => {
    if (!output) return;
    setScoringInProgress(true);
    setBrainScore(null);
    // Try to extract a hook from the strategy output
    const hookMatch = output.match(/RECOMMENDED HOOK[\s\S]*?(?=\n[A-Z][A-Z]|\Z)/);
    const hookText = hookMatch ? hookMatch[0].split('\n').slice(1,4).join(' ').trim() : topic;
    const platformMap = {short:'ig', long:'yt', both:'ig'};
    const sb = window.SupabaseClient;
    const sbUrl = localStorage.getItem('eos-sb-url');
    const sbKey = localStorage.getItem('eos-sb-key');
    try {
      const r = await fetch('/api/brain-score', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          topic, hook: hookText, script: output, caption: '',
          platform: platformMap[contentType] || 'ig',
          duration_seconds: contentType === 'long' ? 1200 : 75,
          hashtag_count: 25,
          save: true,
          workspace_id: sb?.getWorkspaceId?.() || null,
          content_id: contentIdOverride || savedStrategyId,
          supabase_url: sbUrl,
          supabase_key: sbKey,
        })
      });
      if (!r.ok) {
        addToast('Score API failed','error');
        setScoringInProgress(false);
        return;
      }
      const data = await r.json();
      setBrainScore(data);
      addToast(`Brain Score: ${data.overall_score}/100`, data.overall_score >= 75 ? 'success' : data.overall_score >= 50 ? 'info' : 'error');

      addToast('Score request failed: '+e.message,'error');

    if (!output || !window.jspdf) { addToast('PDF library not loaded','error'); return; }
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'letter'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 50;
    // Header gradient bar (yellow)
    doc.setFillColor(255, 214, 10);
    doc.rect(0, 0, pageW, 60, 'F');
    doc.setTextColor(10, 10, 20);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('SUPERNOVA EDITOR', margin, 38);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.text('Content Strategy', pageW - margin, 38, {align:'right'});
    // Topic title
    doc.setTextColor(20, 20, 30);
    doc.setFontSize(18);
    doc.setFont('helvetica', 'bold');
    const titleLines = doc.splitTextToSize(topic, pageW - 2*margin);
    doc.text(titleLines, margin, 100);
    // Date + content type
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(120,120,130);
    doc.text(`Generated ${new Date().toLocaleDateString('en',{month:'long',day:'numeric',year:'numeric'})} • ${contentType.toUpperCase()}-FORM`, margin, 100 + titleLines.length*22 + 8);
    // Body
    doc.setTextColor(40, 40, 50);
    doc.setFontSize(10);
    doc.setFont('courier', 'normal');
    const bodyLines = doc.splitTextToSize(output, pageW - 2*margin);
    let y = 100 + titleLines.length*22 + 36;
    for (const line of bodyLines) {
      if (y > pageH - 60) {
        doc.addPage();
        y = margin;
      }
      doc.text(line, margin, y);
      y += 13;
    }
    // Footer
    const pages = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setFontSize(8);
      doc.setTextColor(150,150,160);
      doc.text(`Supernova Editor • Page ${p} of ${pages}`, pageW/2, pageH - 20, {align:'center'});
    }
    const slug = topic.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);
    doc.save(`supernova-strategy-${slug}.pdf`);
    addToast('PDF downloaded','success');

                      <div>

                        {brainScore.rationale.suggestions.map((s,i) => <div key={i} style={{fontSize:'.78rem',color:'var(--text-muted)',lineHeight:1.5,marginBottom:'.2rem'}}>→ {s}</div>)}
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

            {output && !generating && (
              <div className="card">
                <div className="card-head"><h3>Distribute Strategy</h3></div>
                <div style={{display:'flex',flexDirection:'column',gap:'.5rem'}}>
                  <button className="btn btn-primary" style={{width:'100%'}} onClick={sendToTeleprompter}>📋 Send to Teleprompter</button>
                  <button className="btn btn-ghost" style={{width:'100%'}} onClick={openEmailModal}>📧 Email Strategy</button>
                  <button className="btn btn-ghost" style={{width:'100%'}} onClick={downloadPDF}>📄 Download PDF</button>
                  <button className="btn btn-ghost" style={{width:'100%'}} onClick={copyLeadMagnetUrl} disabled={!savedStrategyId}>🔗 Create Lead Magnet</button>
                </div>
                <div style={{marginTop:'.75rem',padding:'.5rem .65rem',background:'var(--glass)',borderRadius:'var(--radius)',fontSize:'.7rem',color:'var(--text-dim)',fontFamily:'var(--mono)'}}>
                  💡 Sent to Vault automatically. Open <button onClick={() => setVaultOpen(true)} style={{background:'none',border:'none',color:'var(--yellow)',cursor:'pointer',padding:0,textDecoration:'underline'}}>Strategy Vault</button> to access all saved strategies.
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   EDITOR — TELEPROMPTER + DUAL CAMERA REACTION MODE
   ============================================================ */
function EditorView() {
  const {setDrawerOpen, setDrawerTab, addToast} = useApp();
  const [playing, setPlaying] = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const [cameraMode, setCameraMode] = useState('single'); // single, side-by-side, pip
  const [prompterOn, setPrompterOn] = useState(false);
  const [prompterSpeed, setPrompterSpeed] = useState(2);
  const [prompterLine, setPrompterLine] = useState(0);
  const [autoEditOpen, setAutoEditOpen] = useState(false);
  const [autoEditMode, setAutoEditMode] = useState(false);
  const [autoEditProgress, setAutoEditProgress] = useState(0);
  const [autoEditSettings, setAutoEditSettings] = useState({
    removeDeadSpace: true, silenceThreshold: 0.5, gapThreshold: 0.8,
    autoColorGrade: true, autoAudioLevel: true, smartCrop: true,
    autoBackground: false, addCaptions: true, addBeats: true,
    removeUmms: true, smoothJumpCuts: true, removeEdgeFrames: true,
  });
  const updateAutoEdit = (k,v) => setAutoEditSettings(p => ({...p,[k]:v}));

  const runAutoEdit = () => {
    setAutoEditMode(true); setAutoEditProgress(0);
    const steps = ['Analyzing audio waveform...','Detecting silence + dead space...','Removing 47 silent gaps...','Stripping "umms" + filler words...','Smoothing 8 jump cuts...','Auto color grading...','Leveling audio to -14 LUFS...','Generating captions...','Syncing to beat markers...','Applying smart crop...','Optimizing for platform...','Render complete!'];
    let step = 0;
    const interval = setInterval(() => {
      step++;
      setAutoEditProgress(Math.min(100, Math.floor((step/steps.length)*100)));
      if (step <= steps.length) addToast(steps[step-1], step >= steps.length ? 'success' : 'info');
      if (step >= steps.length) { clearInterval(interval); setTimeout(() => setAutoEditMode(false), 1200); }
    }, 700);
  };
  const [clips] = useState([
    {id:1,name:'Hook Take 1',start:0,end:25,color:'var(--yellow)'},
    {id:2,name:'Explanation',start:25,end:55,color:'var(--blue)'},
    {id:3,name:'Reframe',start:55,end:72,color:'var(--green)'},
    {id:4,name:'CTA',start:72,end:90,color:'var(--magenta)'},
  ]);
  const [selectedClip, setSelectedClip] = useState(null);
  const timerRef = useRef(null);

  useEffect(() => {
    if (playing) {
      timerRef.current = setInterval(() => {
        setCurrentTime(t => { if (t >= 90) { setPlaying(false); return 0; } return t + 0.1; });
      }, 100);
    } else { clearInterval(timerRef.current); }
    return () => clearInterval(timerRef.current);
  }, [playing]);

  // Teleprompter auto-scroll
  useEffect(() => {
    if (playing && prompterOn) {
      const id = setInterval(() => {
        setPrompterLine(l => (l + 1) % TELEPROMPTER_SCRIPT.length);
      }, 3000 / prompterSpeed);
      return () => clearInterval(id);
    }
  }, [playing, prompterOn, prompterSpeed]);

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      if (e.key === 'ArrowUp') { e.preventDefault(); setPrompterSpeed(s => Math.min(5, s + 0.5)); }
      if (e.key === 'ArrowDown') { e.preventDefault(); setPrompterSpeed(s => Math.max(0.5, s - 0.5)); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const openDrawer = (tab) => { setDrawerTab(tab); setDrawerOpen(true); };

  const renderCameraContent = (type, label, sublabel) => (
    <div className={`camera-feed ${type}`} style={{display:'grid',placeItems:'center',height:'100%',position:'relative'}}>
      <div className="camera-label">
        <div className="dot" style={{background:type==='selfie'?'var(--blue)':'var(--green)'}}></div>
        {label}
      </div>
      <div style={{textAlign:'center',color:'var(--text-dim)'}}>
        <div style={{width:48,height:48,margin:'0 auto .75rem'}}>{Icons.camera}</div>
        <div style={{fontFamily:'var(--display)',fontSize:'1.1rem',marginBottom:'.25rem'}}>{label}</div>
        <div style={{fontFamily:'var(--mono)',fontSize:'.72rem'}}>{sublabel}</div>
      </div>
    </div>
  );

  return (
    <div className="view-enter">
      <div className="view-head">
        <div><h1>Editor</h1><div className="sub">Teleprompter studio with dual camera reaction mode.</div></div>
        <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
          <button className={`btn btn-sm ${prompterOn ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setPrompterOn(!prompterOn)}>
            {Icons.prompter} {prompterOn ? 'Prompter ON' : 'Prompter'}

          <select value={cameraMode} onChange={e => setCameraMode(e.target.value)} style={{background:'var(--glass)',border:'1px solid var(--border)',color:'var(--text)',padding:'.4rem .7rem',borderRadius:'var(--radius)',fontFamily:'var(--mono)',fontSize:'.75rem',backdropFilter:'blur(8px)'}}>
            <option value="single">Single Camera</option>
            <option value="side-by-side">Side by Side</option>
            <option value="pip">PiP Reaction</option>
          </select>
          <button className="btn btn-primary btn-sm" onClick={() => addToast('Export started...', 'info')}>
            {Icons.download} Export

        </div>
      </div>

      {/* VIDEO PREVIEW */}
      <div className="editor-stage scanline">

        {/* TELEPROMPTER OVERLAY */}

/* ============================================================

function PublishView() {
  const {addToast, setVaultOpen, setVaultLoadHandler} = useApp();
  const [month, setMonth] = useState(2);
  const [selectedDay, setSelectedDay] = useState(null);
  const [platforms, setPlatforms] = useState({ig:true,tt:true,yt:true,li:true,fb:true,em:true});
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const daysInMonth = [31,29,31,30,31,30,31,31,30,31,30,31];
  const firstDayOffset = [3,6,0,3,5,1,3,6,2,4,0,2];
  const [folders, setFolders] = useState([
    {id:'inbox', name:'Inbox', color:'var(--text-dim)', count:0},
    {id:'q1-launch', name:'Q1 Launch Sprint', color:'var(--yellow)', count:8},
    {id:'evergreen', name:'Evergreen Library', color:'var(--green)', count:23},
    {id:'collabs', name:'Collaborator Drops', color:'var(--blue)', count:12},
    {id:'archive', name:'Archive', color:'var(--text-dim)', count:47},
  ]);
  const [activeFolder, setActiveFolder] = useState('q1-launch');
  const [showFolderModal, setShowFolderModal] = useState(false);
  const [newFolderName, setNewFolderName] = useState('');
  const [editingPost, setEditingPost] = useState(null);
  const [postCaption, setPostCaption] = useState('');
  const [postHashtags, setPostHashtags] = useState('');
  const [postMentions, setPostMentions] = useState('');
  const [postPlatforms, setPostPlatforms] = useState({ig:true});

  const days = daysInMonth[month];
  const offset = firstDayOffset[month];
  const scheduledDays = {3:'Carousel',5:'YouTube',8:'Reel',10:'Clips',12:'Newsletter',15:'Reel',18:'Carousel',20:'YouTube',22:'Clips',25:'Reel',28:'Lead Magnet'};

  // Register vault load handler so "Import from Vault" works in this view
  useEffect(() => {
    setVaultLoadHandler(() => (text) => {
      // Parse the loaded section text into caption + hashtags
      const lines = text.split('\n');
      const hashtagLine = lines.find(l => l.includes('#'));
      const captionLines = lines.filter(l => !l.match(/^[A-Z\s]+:$/));
      setPostCaption(captionLines.join('\n').trim());
      if (hashtagLine) {
        setPostHashtags(hashtagLine.match(/#\w+/g)?.join(' ') || '');
      }
      // Look for @ mentions
      const mentions = text.match(/@\w+/g);
      if (mentions) setPostMentions(mentions.join(' '));
      addToast('Imported from Strategy Vault — review caption + hashtags','success');
      setEditingPost({day: selectedDay || 18, platform: 'ig', isNew: !editingPost});
    });
    return () => setVaultLoadHandler(null);
  }, [selectedDay]);

  const createFolder = () => {
    if (!newFolderName.trim()) return;
    const id = newFolderName.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    setFolders(prev => [...prev, {id, name: newFolderName, color: 'var(--magenta)', count: 0}]);
    setActiveFolder(id);
    setNewFolderName('');
    setShowFolderModal(false);
    addToast(`Folder "${newFolderName}" created`,'success');
  };

  const importFromVault = () => {
    setVaultOpen(true);
    addToast('Pick a strategy section to import','info');
  };

  return (
    <div className="view-enter">
      {/* NEW FOLDER MODAL */}
      {showFolderModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',zIndex:200,display:'grid',placeItems:'start center',paddingTop:'15vh'}} onClick={() => setShowFolderModal(false)}>
          <div style={{width:'min(440px,90vw)',background:'var(--bg-solid)',border:'1px solid var(--border-strong)',borderRadius:'var(--radius-xl)',padding:'1.5rem',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}} onClick={e => e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
              <h3 style={{fontFamily:'var(--display)',fontSize:'1.2rem'}}>📁 New Campaign Folder</h3>
              <button className="icon-btn" onClick={() => setShowFolderModal(false)} style={{width:28,height:28}}>{Icons.x}</button>
            </div>
            <label className="field">
              <span className="lbl">Folder Name</span>
              <input className="input" autoFocus value={newFolderName} onChange={e => setNewFolderName(e.target.value)} onKeyDown={e => e.key === 'Enter' && createFolder()} placeholder="e.g., Black Friday Campaign" />
            </label>
            <div style={{display:'flex',gap:'.5rem'}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={createFolder} disabled={!newFolderName.trim()}>Create</button>
              <button className="btn btn-ghost" onClick={() => setShowFolderModal(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* POST COMPOSER MODAL */}
      {editingPost && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',zIndex:200,display:'grid',placeItems:'start center',paddingTop:'8vh'}} onClick={() => setEditingPost(null)}>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

  );

}
